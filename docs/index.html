<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="app-version" content="v33">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>스윙 로그</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,system-ui,sans-serif;background:#E8E8F5}
@media (prefers-color-scheme:dark){body{background:#121321}}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="config.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 폰 우선 단일 컬럼 + 하단 탭바. 측정 숫자는 모노 탭뉴머럴, 제목은 고딕A1 */
:root{
  --bg:#E8E8F5; --surface:#FFFFFF; --surface2:#DBDBEF; --line:#CBCBE5;
  --fg:#1B1B2A; --fg2:#555568; --fg3:#8C8CA1;
  --accent:#343672; --accentSoft:#DEDEF2; --onAccent:#FFFFFF;
  --ok:#1F6B52; --okSoft:#D6EAE1;
  --warn:#7A5512; --warnSoft:#F4E4BC;
  --bad:#9B3F4B; --badSoft:#F4DBDF;
  --shadow:0 1px 2px rgba(27,27,42,.05),0 4px 14px rgba(27,27,42,.06),0 16px 36px rgba(27,27,42,.045);
  --ring:0 0 0 3px var(--accentSoft);
  --fDisp:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  --fBody:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  --fData:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121321; --surface:#1A1B2C; --surface2:#23253A; --line:#30324A;
  --fg:#E7E7F3; --fg2:#9A9AB2; --fg3:#6C6C86;
  --accent:#A9ABE6; --accentSoft:#23253C; --onAccent:#15162A;
  --ok:#7FC8A6; --okSoft:#172B23;
  --warn:#D9B36C; --warnSoft:#2E2717;
  --bad:#E08A97; --badSoft:#321C24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --ring:0 0 0 3px var(--accentSoft);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121321; --surface:#1A1B2C; --surface2:#23253A; --line:#30324A;
  --fg:#E7E7F3; --fg2:#9A9AB2; --fg3:#6C6C86;
  --accent:#A9ABE6; --accentSoft:#23253C; --onAccent:#15162A;
  --ok:#7FC8A6; --okSoft:#172B23;
  --warn:#D9B36C; --warnSoft:#2E2717;
  --bad:#E08A97; --badSoft:#321C24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --ring:0 0 0 3px var(--accentSoft);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fBody);line-height:1.68;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
h1,h2,h3,h4{font-family:var(--fDisp);font-weight:700;letter-spacing:-.022em;margin:0;text-wrap:balance;line-height:1.34}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 뼈대 ---- */
#app{max-width:720px;margin:0 auto;padding:0 16px 118px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:11px;padding:16px 0 14px;margin-bottom:18px}
.mark{width:32px;height:32px;border-radius:11px;background:var(--accent);flex:none;position:relative;
  box-shadow:0 2px 8px rgba(52,54,114,.26)}
.mark::after{content:"";position:absolute;inset:0;border-radius:11px;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95) 0 3px,transparent 3.5px),
             linear-gradient(transparent 0 62%,rgba(255,255,255,.55) 62% 64%,transparent 64%)}
.brand{font-family:var(--fDisp);font-weight:700;font-size:17.5px;letter-spacing:-.015em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--fBody);font-weight:400;font-size:11.5px;color:var(--fg3);letter-spacing:0}
.topbar .btn.ghost{flex:none;background:var(--surface2);color:var(--fg2);border-radius:999px;
  padding:7px 12px;font-size:12.5px;font-weight:600;text-decoration:none}
.topbar .btn.ghost:hover{background:var(--accentSoft);color:var(--accent)}
#themeBtn{padding:7px 10px;font-size:14px;line-height:1}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(27,27,42,.07);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
nav.tabs button{background:none;border:0;padding:8px 2px 7px;border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg3);font-size:10.5px;font-weight:500;
  transition:background .18s ease,color .18s ease;-webkit-tap-highlight-color:transparent}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accentSoft);font-weight:700}

/* ---- 공통 부품 ---- */
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{border:1px solid var(--line)}}
:root[data-theme="dark"] .card{border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.eyebrow{font-family:var(--fDisp);font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--fg2)}
.muted{color:var(--fg2);font-size:13.5px}
.tiny{color:var(--fg3);font-size:12px}
.sec-title{font-size:20px;margin-bottom:2px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{border:1px solid transparent;background:var(--surface2);border-radius:13px;padding:11px 16px;
  font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .18s ease,transform .12s ease,box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent}
.btn:hover{background:color-mix(in srgb,var(--surface2) 80%,var(--fg3))}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--onAccent);box-shadow:0 2px 10px rgba(52,54,114,.24)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.ghost{background:transparent;color:var(--fg2);padding:9px 11px}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}

label.f{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--fg2);min-width:0}
/* 제목 자리에 놓이는 날짜 — 눌러서 바로 고친다 */
input.dateTitle{width:auto;min-width:0;max-width:100%;flex:0 1 auto;white-space:nowrap;
  background:transparent;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;
  padding:0 2px 3px;font-family:var(--fDisp);font-size:21px;font-weight:700;letter-spacing:-.005em;
  color:var(--fg);cursor:pointer;-webkit-appearance:none;appearance:none}
input.dateTitle:focus{outline:none;border-bottom-color:var(--accent)}
input.dateTitle::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select,textarea{
  background:var(--surface2);border:1px solid transparent;border-radius:13px;padding:12px 13px;font-size:15px;
  width:100%;font-family:var(--fBody);transition:background .18s ease,box-shadow .18s ease}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=password]:focus,
input[type=tel]:focus,select:focus,textarea:focus{
  outline:none;background:var(--surface);border-color:var(--accent);box-shadow:var(--ring)}
::placeholder{color:var(--fg3)}
input.num,input.lr{font-family:var(--fData);font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;
  font-family:var(--fDisp);letter-spacing:.01em;width:auto;max-width:max-content;flex:none;vertical-align:1px}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.neutral{background:var(--surface2);color:var(--fg2)}
.chip.acc{background:var(--accentSoft);color:var(--accent)}

.grade{font-family:var(--fDisp);font-weight:700;font-size:13.5px;width:30px;height:30px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.grade.A{background:var(--okSoft);color:var(--ok)}
.grade.B{background:var(--accentSoft);color:var(--accent)}
.grade.C{background:var(--warnSoft);color:var(--warn)}
.grade.D{background:var(--badSoft);color:var(--bad)}
.grade.X{background:var(--surface2);color:var(--fg3)}

/* 측정 타일 */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:470px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
.metric{background:var(--surface2);border-radius:14px;padding:11px 11px 12px;min-width:0}
.metric b{display:block;font-family:var(--fData);font-weight:700;font-size:18px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{display:block;font-size:11px;color:var(--fg3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric.good b{color:var(--ok)}
.metric.off b{color:var(--bad)}
.metric .d{font-size:10.5px;font-family:var(--fData);font-weight:600}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)} .d.flat{color:var(--fg3)}

/* 체크리스트 */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer;-webkit-tap-highlight-color:transparent}
.check:last-child{border-bottom:0}
.check input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:9px;flex:none;margin-top:2px;cursor:pointer;position:relative;background:var(--surface2);transition:background .16s ease,border-color .16s ease}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.check .ct{min-width:0;flex:1}
.check .ct b{display:block;font-size:14.5px;font-weight:600}
.check .ct span{display:block;font-size:12.5px;color:var(--fg2)}
.check input:checked + .ct b{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--fg3)}

/* 진행 단계 */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{height:5px;flex:1;border-radius:999px;background:var(--line);transition:background .25s ease}
.steps div.on{background:var(--accent)}
.steps div.done{background:var(--ok)}

.listrow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer;-webkit-tap-highlight-color:transparent}
.listrow:last-child{border-bottom:0}
.listrow .bd{flex:1;min-width:0}
.listrow .bd b{display:block;font-size:15.5px;font-weight:700;font-family:var(--fDisp);letter-spacing:-.005em}
.listrow .bd span{display:block;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow .rt{text-align:right;flex:none;font-family:var(--fData);font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.listrow .rt b{font-size:16px;font-weight:700;letter-spacing:-.02em;display:block}
.listrow .rt span{font-size:11px;color:var(--fg3);font-family:var(--fBody)}

.lc{margin:0 0 12px;display:grid;gap:8px}
.lc-ai{background:var(--accentSoft);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14.5px;line-height:1.65}
.lc-ai p{margin:0}.lc-ai p+p{margin-top:6px}
.lc-v{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.lc-next{margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:var(--surface);font-weight:600}
.lc-next b{color:var(--accent);margin-right:4px}
.lc-q{margin-top:8px!important;font-weight:600}
.lc-me{justify-self:end;max-width:85%;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:14px}
.lc-opts{display:flex;flex-wrap:wrap;gap:6px}
.lc-opts .btn{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.lc-in{display:flex;gap:6px}.lc-in input{flex:1;min-width:0}
.ai{background:var(--accentSoft);border-radius:16px;padding:15px 16px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ai .hd{font-family:var(--fDisp);font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--accent);margin-bottom:7px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:14.5px;line-height:1.72;white-space:pre-wrap}
.banner{border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.62;background:var(--surface2);color:var(--fg2)}
.banner.warn{background:var(--warnSoft);color:var(--warn)}
.banner.bad{background:var(--badSoft);color:var(--bad)}
.banner.ok{background:var(--okSoft);color:var(--ok)}

.empty{text-align:center;padding:38px 18px;color:var(--fg2)}
.empty h3{font-size:17.5px;margin-bottom:8px;color:var(--fg)}
.empty p{font-size:13.5px}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(18,19,33,.4);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
.sheet.fresh{animation:fadeIn .2s ease}
.sheet.fresh .inner{animation:riseUp .26s cubic-bezier(.22,.9,.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet .inner{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;
  padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 48px rgba(18,19,33,.2)}
@keyframes riseUp{from{transform:translateY(18px)}to{transform:translateY(0)}}
.sheet .hdl{width:40px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 16px}

table.gap{width:100%;border-collapse:collapse;font-family:var(--fData);font-variant-numeric:tabular-nums;font-size:13px}
table.gap th{font-family:var(--fBody);font-size:11px;color:var(--fg3);text-align:right;font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
table.gap th:first-child,table.gap td:first-child{text-align:left;font-family:var(--fBody);font-weight:600}
table.gap td{padding:9px 6px;text-align:right;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
table.gap tr:last-child td{border-bottom:0}
td.flagbad{color:var(--bad);font-weight:600}
td.flagok{color:var(--ok)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.spark{display:block;width:100%;height:76px}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--surface2);flex:none}
.filebtn{position:relative;display:flex;align-items:center;gap:13px;border:1.5px dashed var(--line);border-radius:16px;
  padding:18px 15px;cursor:pointer;background:var(--surface2);width:100%;min-height:66px;
  transition:border-color .18s ease,background .18s ease;-webkit-tap-highlight-color:transparent}
.filebtn:hover,.filebtn:focus,.filebtn.drag{border-color:var(--accent);background:var(--accentSoft);outline:none}
.filebtn.on{border-style:solid;border-color:var(--accent)}
.filebtn input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;
  font-size:0;border:0;padding:0;margin:0}
.filebtn .fb-ic{width:36px;height:36px;border-radius:12px;background:var(--accentSoft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none;line-height:1}
.filebtn .fb-tx{min-width:0;flex:1}
.filebtn .fb-tx b{display:block;font-size:14.5px;font-weight:600}
.filebtn .fb-tx span{display:block;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastebox{margin-top:9px;min-height:48px;border:1.5px dashed var(--line);border-radius:14px;padding:14px 13px;
  font-size:13.5px;color:var(--fg2);background:var(--surface2);-webkit-user-select:text;user-select:text;
  overflow:hidden;white-space:nowrap}
.pastebox:empty:before{content:attr(data-ph);color:var(--fg3)}
.pastebox:focus{outline:none;border-color:var(--accent);background:var(--accentSoft)}
body.locked > :not(#lockHost){display:none !important}
.lockWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;background:var(--bg);overflow-y:auto;z-index:50}
.lockCard{width:100%;max-width:340px;text-align:center}
.lockMark{font-size:40px;line-height:1;margin-bottom:14px}
.lockCard h2{font-size:23px;font-weight:700;letter-spacing:-.01em}
.lockCard .f{text-align:left}
.optrow{display:flex;gap:16px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg2);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.opt input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.photoPrev{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:var(--surface2)}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:14px;padding:4px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:11px 6px;cursor:pointer;
  font-family:var(--fDisp);font-size:14.5px;font-weight:600;color:var(--fg2);min-height:44px;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;-webkit-tap-highlight-color:transparent}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;
  box-shadow:0 1px 2px rgba(27,27,42,.06),0 2px 8px rgba(27,27,42,.07)}
.seg button:active{transform:scale(.97)}
.segWrap{margin-top:12px}
.seg.oneline button{padding:11px 4px;font-size:14px;white-space:nowrap}
.seg.oneline .tog{flex:.9;margin-left:6px;position:relative}
.seg.oneline .tog::before{content:'';position:absolute;left:-5px;top:8px;bottom:8px;width:1px;background:var(--line,rgba(0,0,0,.12))}
.segWrap .lab{font-size:12.5px;font-weight:600;color:var(--fg2)}
.holes{display:grid;grid-template-columns:34px repeat(9,minmax(0,1fr));gap:3px;align-items:center}
.holes>span{font-size:11px;color:var(--fg3);text-align:center;font-family:var(--fBody)}
.holes>span.rl{text-align:left;color:var(--fg2);font-weight:600}
.holes input{padding:8px 0;text-align:center;font-size:14px;border-radius:10px;min-width:0}
.holes .par{font-size:12px;color:var(--fg3);text-align:center}
.holeSum{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--fg3);font-family:var(--fBody)}
.holeSum b{color:var(--fg);font-size:13px}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){ if(!s) return ""; var p=String(s).split("-"); return p.length<3?s:(+p[1])+"월 "+(+p[2])+"일"; }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function lrToNum(v){ if(v==null||v==="") return null; var s=String(v).trim().toUpperCase();
  var neg=/^L/.test(s)||/L$/.test(s), pos=/^R/.test(s)||/R$/.test(s);
  var n=parseFloat(s.replace(/[LR\s]/g,"")); if(!isFinite(n)) return null;
  if(neg) return -Math.abs(n); if(pos) return Math.abs(n); return n; }
function numToLR(n,dp){ if(n==null||!isFinite(n)) return "—"; var a=Math.abs(n).toFixed(dp==null?1:dp);
  if(Math.abs(n)<0.05) return a; return (n<0?"L":"R")+a; }
function r1(n){ return n==null?"—":(Math.round(n*10)/10); }

/* ====================== 저장소 (구글 시트) ====================== */
/* 깃허브 페이지에서 앱스 스크립트 서버로 보낸다.
   Content-Type 을 text/plain 으로 두면 브라우저가 미리 묻는 절차(preflight)를 건너뛴다.
   앱스 스크립트는 그 절차에 답할 수 없어서, 이렇게 해야 통한다. */
function apiUrl(){
  try{
    var u=localStorage.getItem("swinglog.api");
    if(u) return u;
  }catch(e){}
  return (window.SWINGLOG_API||"");
}
function saveApiUrl(u){ try{ localStorage.setItem("swinglog.api",u); }catch(e){} }

/* 점검 전용. 잠겼다는 답이 와도 열쇠를 지우지 않는다.
   apiReadRound 는 새 코드에만 있고, 로그인도 필요하다.
   - "알 수 없는 요청" 이면 옛 코드
   - "로그인이 필요" 면 새 코드가 붙은 것 */
function probeServer(){
  var url=apiUrl();
  if(!url) return Promise.resolve({code:"nourl", msg:"서버 주소가 없습니다."});
  return fetch(url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({fn:"apiReadRound",args:[""],token:""})
  }).then(function(r){ return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ return {code:"bad", msg:"서버 답을 읽지 못했습니다. 주소가 /exec 로 끝나는지 확인하세요."}; }
    var err=String((j&&j.error)||"");
    if(/알 수 없는 요청/.test(err)) return {code:"old", msg:"아직 옛 코드입니다. 붙여넣기는 됐어도 배포가 안 된 경우가 많습니다. 배포 → 배포 관리 → 연필 → 버전을 새 버전으로 → 배포 해 주세요."};
    if(j&&j.locked) return {code:"new", msg:"새 코드가 붙었습니다. 이제 들어가기만 하면 됩니다. 비번 없이 열려면 편집기에서 openMode 를 한 번 실행하세요."};
    if(j&&j.ok) return {code:"newopen", msg:"새 코드가 붙었고 비번 없이 열린 상태입니다. 새로고침하면 바로 들어갑니다."};
    return {code:"other", msg:"서버가 이렇게 답했습니다: "+(err||t).slice(0,120)};
  }).catch(function(e){
    return {code:"net", msg:"서버에 닿지 못했습니다: "+((e&&e.message)||"연결 실패")};
  });
}

function call(name){
  var args=[].slice.call(arguments,1);
  var url=apiUrl();
  if(!url) return Promise.reject({message:"서버 주소가 아직 없습니다.",needUrl:true});
  return fetch(url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({fn:name,args:args,token:getToken()})
  }).then(function(r){
    if(!r.ok){
      if(r.status===404) throw {message:"서버 주소가 더 이상 살아 있지 않습니다. "
        +"앱스 스크립트에서 '새 배포'를 만들면 주소가 바뀝니다. 배포 관리에서 지금 주소를 확인해 주세요.", dead:true};
      if(r.status===401||r.status===403) throw {message:"서버에 접근이 막혔습니다. 배포 설정에서 '모든 사용자'로 열려 있는지 확인해 주세요."};
      throw {message:"서버가 "+r.status+" 로 답했습니다."};
    }
    return r.text();
  }).then(function(t){
    var j;
    try{ j=JSON.parse(t); }
    catch(e){ throw {message:"서버 답을 읽지 못했습니다. 배포 주소가 /exec 로 끝나는지, 접근 권한이 '모든 사용자'인지 확인하세요."}; }
    if(j.ok) return j.value;
    if(j.locked){
      saveToken("");
      S.lock.need=true; S.lock.checking=false; S.lock.err="다시 들어와 주세요."; S.lock.focused=false; render();
    }
    throw {message:j.error||"요청이 처리되지 않았습니다."};
  });
}
function errMsg(e){
  if(!e) return "알 수 없는 오류입니다.";
  var m=String(e.message||e);
  if(/Authoriz|권한/i.test(m)) return "권한이 없습니다. 웹앱 주소를 다시 열어 접근을 허용해 주세요.";
  if(/exceeded|quota|한도/i.test(m)) return "구글 사용 한도에 걸렸습니다. 잠시 뒤 다시 시도하세요.";
  return m.slice(0,200);
}
function applyCfg(cfg){
  if(!cfg) return;
  Object.keys(cfg).forEach(function(k){
    var c=cfg[k]; if(!c) return;
    var t=TARGET[k]||{};
    function pair(a){ return (a&&a[0]!=null&&a[1]!=null)?[a[0],a[1]]:null; }
    if(pair(c.carry))  t.carry=pair(c.carry);
    if(pair(c.launch)) t.launch=pair(c.launch);
    if(pair(c.back))   t.back=pair(c.back);
    if(c.width&&c.width[1]!=null) t.width=[0,c.width[1]];
    if(c.depth&&c.depth[1]!=null) t.depth=[0,c.depth[1]];
    if(c.dir!=null) t.dir=c.dir;
    if(c.label) t.label=c.label;
    TARGET[k]=t;
  });
}
/* 기록은 구글 시트가 원본이다. 다만 열 때마다 서버를 깨우고 시트를 다 읽느라
   몇 초를 기다리게 된다. 그래서 마지막으로 받은 내용을 이 기기에 한 벌 베껴 두고,
   열자마자 그것부터 보여준 뒤 뒤에서 조용히 새로 받아 맞춘다.
   베껴 둔 것은 어디까지나 사본이고, 기준은 늘 시트다. */
var CACHE_KEY="swinglog.cache";

function putCache(d){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), d:d})); }catch(e){}
}
function getCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    return (o&&o.d)?o:null;
  }catch(e){ return null; }
}
function dropCache(){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} }

/** 화면에 있는 내용을 이 기기 사본에 그대로 반영한다 */
function syncCache(){
  putCache({clubs:S.clubs, sessions:S.sessions, rounds:S.rounds,
            cfg:S.cfgRaw||null, hasAI:ready.ai, sheetUrl:S.sheetUrl});
}

function applyPayload(d){
  function byDate(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); }
  S.clubs=(d.clubs||[]).sort(function(a,b){ return (a.order||0)-(b.order||0); });
  S.sessions=(d.sessions||[]).sort(byDate);
  S.rounds=(d.rounds||[]).sort(byDate);
  applyCfg(d.cfg);
  S.cfgRaw=d.cfg||null;

function put(name,obj,quiet){
  if(!obj.id) obj.id=uuid();
  var fn = name==="clubs" ? "apiSaveClub" : name==="sessions" ? "apiSaveSession" : "apiSaveRound";
  return call(fn,obj).then(function(id){
    if(id) obj.id=id;
    var arr=S[name],hit=false;
    for(var i=0;i<arr.length;i++) if(arr[i].id===obj.id){ arr[i]=obj; hit=true; break; }
    if(!hit) arr.unshift(obj);
    if(name==="clubs") arr.sort(function(a,b){return (a.order||0)-(b.order||0);});
    else arr.sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
    syncCache();
    if(!quiet) render();
  }).catch(function(e){ flash("시트에 저장하지 못했습니다. "+errMsg(e)); });
}

/* ====================== 평가 로직 ====================== */
function tkey(c){
  if(!c) return null;
  if(c.tkey && TARGET[c.tkey]) return c.tkey;
  if(c.cat==="driver") return "driver";
  if(c.cat==="hybrid"||c.cat==="wood") return "hybrid";
  if(c.cat==="iron"){ var m=String(c.name||"").match(/(\d)/); if(m){ var k="i"+m[1]; if(TARGET[k]) return k; }
    if(/P|피칭/i.test(c.name||"")) return "pw"; }
  if(c.cat==="wedge"){ var l=num(c.loft); if(l){ if(l<=49) return "w48"; if(l<=54) return "w52"; return "w56"; } }
  return null;
}
function inRange(v,r){ return v!=null && r && v>=r[0] && v<=r[1]; }

/* 10회 평균 1세트를 기준 및 직전 기록과 대조 */
function evalBlock(club,m,prev){
  var T = TARGET[tkey(club)] || null;
  var good=[],bad=[],deltas={};
  if(prev) METRICS.forEach(function(x){
    if(m[x.k]!=null && prev[x.k]!=null) deltas[x.k]=Math.round((m[x.k]-prev[x.k])*10)/10;
  });
  if(T){
    [["carry","캐리","m"],["launch","발사각","°"],["back","백스핀","rpm"]].forEach(function(p){
      var v=m[p[0]], r=T[p[0]]; if(v==null||!r) return;
      if(inRange(v,r)) good.push(p[1]+" "+r1(v)+p[2]+" (기준 "+r[0]+"~"+r[1]+")");
      else bad.push(p[1]+" "+r1(v)+p[2]+" — 기준 "+r[0]+"~"+r[1]+"에서 "+(v<r[0]?"낮음":"높음"));
    });
    [["width","좌우 편차","m"],["depth","앞뒤 편차","m"]].forEach(function(p){
      var v=m[p[0]], r=T[p[0]]; if(v==null||!r) return;
      if(v<=r[1]) good.push(p[1]+" "+r1(v)+p[2]+" (기준 "+r[1]+" 이하)");
      else bad.push(p[1]+" "+r1(v)+p[2]+" — 기준 "+r[1]+p[2]+"보다 "+r1(v-r[1])+p[2]+" 넓음");
    });
    if(m.dir!=null){
      if(Math.abs(m.dir)<=T.dir) good.push("방향각 "+numToLR(m.dir)+"° (기준 ±"+T.dir+"° 이내)");
      else bad.push("방향각 "+numToLR(m.dir)+"° — "+(m.dir<0?"왼":"오른")+"쪽으로 출발. 셋업 정렬 점검");
    }
  }
  if(m.side!=null && Math.abs(m.side)>600) bad.push("사이드스핀 "+numToLR(m.side,0)+"rpm — 좌우 회전이 큼");
  return {good:good,bad:bad,deltas:deltas,hasT:!!T};
}
function metricState(club,k,v){
  var T=TARGET[tkey(club)]; if(!T||v==null) return "";
  if(k==="carry"||k==="launch"||k==="back") return T[k] ? (inRange(v,T[k])?"good":"off") : "";
  if(k==="width"||k==="depth") return T[k] ? (v<=T[k][1]?"good":"off") : "";
  if(k==="dir") return Math.abs(v)<=T.dir ? "good":"off";
  return "";
}
function isFocus(b){ return !b || b.mode!=="섞어"; }

function lastBlockFor(clubId,beforeSessionId){
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i]; if(beforeSessionId && s.id===beforeSessionId) continue;
    var bs=s.blocks||[];
    for(var j=bs.length-1;j>=0;j--) if(bs[j].clubId===clubId && bs[j].m && isFocus(bs[j])) return {m:bs[j].m,date:s.date};
  }
  return null;
}
function clubBest(clubId){
  var best=null;
  S.sessions.forEach(function(s){ (s.blocks||[]).forEach(function(b){
    if(b.clubId===clubId && isFocus(b) && b.m && b.m.carry!=null && (!best||b.m.carry>best.carry)) best={carry:b.m.carry,date:s.date};
  });});
  return best;
}
function clubSeries(clubId,k){
  var out=[];
  S.sessions.slice().reverse().forEach(function(s){ (s.blocks||[]).forEach(function(b){
    if(b.clubId===clubId && isFocus(b) && b.m && b.m[k]!=null) out.push({v:b.m[k],date:s.date});
  });});
  return out;
}
/* 섞어 친 것만 따로 — 코스로 얼마나 옮겨졌는지는 이쪽으로 본다 */
function mixSeries(clubId,k){
  var out=[];
  S.sessions.slice().reverse().forEach(function(s){ (s.blocks||[]).forEach(function(b){
    if(b.clubId===clubId && !isFocus(b) && b.m && b.m[k]!=null) out.push({v:b.m[k],date:s.date});
  });});
  return out;
}

/* 가방 전체 — 로프트/거리 간격 */
function bagGaps(){
  var rows=S.clubs.filter(function(c){ return c.cat!=="putter"; }).map(function(c){
    var b=clubBest(c.id), t=TARGET[tkey(c)];
    return {c:c,loft:num(c.loft),carry:b?b.carry:(t?Math.round((t.carry[0]+t.carry[1])/2):null),measured:!!b};
  }).filter(function(r){ return r.carry!=null; }).sort(function(a,b){ return b.carry-a.carry; });
  for(var i=0;i<rows.length;i++){
    rows[i].dCarry = i===0?null:Math.round((rows[i-1].carry-rows[i].carry)*10)/10;
    rows[i].dLoft = (i===0||rows[i].loft==null||rows[i-1].loft==null)?null:Math.round((rows[i].loft-rows[i-1].loft)*10)/10;
  }
  return rows;
}

/* ====================== AI ====================== */
function ask(key,prompt,opts){
  if(!sample){ S.msg[key]="AI 코칭을 쓸 수 없는 화면입니다."; render(); return Promise.reject(); }
  S.busy[key]=true; S.msg[key]=null; S.asksec[key]=0; render();
  /* 몇 초째인지 보여 준다. 멈춘 것인지 도는 중인지 구분이 돼야 한다. */
  (function tick(){
    if(!S.busy[key]) return;
    S.asksec[key]=(S.asksec[key]||0)+1;
    if(!tickOnly()) render();        /* 글자만 못 바꾸면 그때만 다시 그린다 */
    setTimeout(tick,1000);
  })();
  /* 끝나지 않는 일은 없어야 한다. 서버가 침묵하면 2분에 끊는다. */
  return withTimeout(sample(prompt,opts||{}),120000,
      "서버가 120초 동안 답하지 않았습니다. 잠시 뒤 다시 눌러 주세요.")
    .then(function(r){ S.busy[key]=false; render(); return r.text; })
    .catch(function(e){ S.busy[key]=false;
      var c=e&&e.code;
      var raw=(e&&e.message)?String(e.message):"";
      S.msg[key]= c==="not_granted"||c==="sampling_disabled" ? "AI 사용이 허용되지 않았습니다."
        : c==="rate_limited" ? "요청이 몰렸습니다. 잠시 뒤 다시 눌러 주세요."
        : c==="refused" ? "이 내용은 분석하지 못했습니다. 입력을 조금 바꿔 보세요."
        : (raw || "분석에 실패했습니다. 다시 눌러 주세요.");
      render(); throw e; });
}
function askJson(key,prompt,opts){
  if(!sample){ S.msg[key]="AI를 쓸 수 없는 화면입니다."; render(); return Promise.reject(); }
  S.busy[key]=true; S.msg[key]=null; render();
  return sample.json(prompt,opts||{}).then(function(v){ S.busy[key]=false; render(); return v; })
    .catch(function(e){ S.busy[key]=false;
      S.msg[key]= (e&&e.code==="invalid_json") ? "사진에서 숫자를 읽지 못했습니다. 화면이 잘 보이게 다시 찍거나 직접 입력하세요."
        : (e&&e.code==="not_granted") ? "AI 사용이 허용되지 않았습니다." : "읽어내지 못했습니다. 직접 입력해 주세요.";
      render(); throw e; });
}
function profileText(){
  /* 손으로 적어 둔 소개가 아니라, 시트에 쌓인 것에서 매번 다시 만든다.
     옛 숫자가 섞이면 답이 그만큼 어긋난다. */
  var L=[];
  L.push("상대: 50대 남성 아마추어. 평일·주말 가리지 않고 시간이 되면 연습하며 한 번에 1~2시간. "
        +"일요일 오전에는 지인과 스크린을 친다. 필드는 시간·비용 때문에 드물다.");

  /* 라운드 — 실제 스코어로 수준을 잡는다 */
  var rs=S.rounds.filter(function(r){ return r.score!=null; }).slice(0,5);
  if(rs.length){
    L.push("최근 라운드 "+rs.length+"회: "+rs.map(function(r){
      var over=(r.par?((r.score-r.par>0?"+":"")+(r.score-r.par)):"");
      var t=holeTally(r);
      return fmtDate(r.date)+" "+(r.type==="field"?"필드":"스크린")+" "+r.score+"타"+(over?("("+over+")"):"")
        +(r.putts!=null?(" 퍼팅"+r.putts):"")
        +(r.gir!=null?(" 그린"+r.gir+"/18"):"")
        +(t.dbl?(" 더블이상"+t.dbl+"홀"):"")
        +(t.n>=18?(" 전반"+t.out+"/후반"+t.inn):"");
    }).join(" / "));
  } else {
    L.push("라운드 기록 없음 — 스코어 수준은 추정하지 말 것.");
  }

  /* 클럽별 실측 — 목표 대비 어디가 벌어져 있는지까지 */
  var meas=[];
  S.clubs.forEach(function(c){
    if(c.spare) return;
    var b=lastBlockFor(c.id);
    if(!b) return;
    var T=TARGET[tkey(c)];
    var gap="";
    if(T&&b.m.carry!=null){
      if(b.m.carry<T.carry[0]) gap=" (목표 "+T.carry[0]+"~"+T.carry[1]+"m에 미달)";
      else if(b.m.carry>T.carry[1]) gap=" (목표 상회)";
    }
    meas.push("· "+c.name+(c.loft?(" "+c.loft+"도"):"")+": "+metricSummary(b.m)+gap);
  });
  if(meas.length) L.push("클럽별 최근 10회 평균\n"+meas.join("\n"));
  else L.push("측정 기록이 아직 없다 — 숫자를 지어내지 말 것.");

  /* 연습량 */
  if(S.sessions.length){
    var last=S.sessions[0], first=S.sessions[S.sessions.length-1];
    L.push("연습 기록 "+S.sessions.length+"회 ("+fmtDate(first.date)+" ~ "+fmtDate(last.date)+").");
  }

  /* 본인이 적은 느낀점 — 지금 무엇과 씨름 중인지가 여기 있다 */
  var fl=S.sessions.filter(function(x){ return x.feeling&&String(x.feeling).trim(); }).slice(0,3);
  if(fl.length){
    L.push("본인이 적은 최근 느낀점\n"+fl.map(function(x){
      return "· "+fmtDate(x.date)+": "+String(x.feeling).trim().slice(0,160);
    }).join("\n"));
  }

  L.push("답은 한국어로. 사과하거나 자격을 따지는 표현은 쓰지 말 것. "
        +"위에 적힌 숫자만 근거로 삼고, 없는 숫자는 만들지 말고 '측정이 없다'고 쓸 것. "
        +"장비 교체 권유는 본인이 묻지 않는 한 하지 말 것.");
  return L.join("\n\n");
}

     여기서 지우면 앱이 다시 열릴 때 첫 그리기에 적어 둔 것이 날아간다. */

    if(Date.now()-(o.at||0) > 20*60*60*1000){ dropDraft(); return null; }   /* 하루 지난 것은 이어 할 일이 아니다 */
    return o;
  }catch(e){ return null; }

function connCard(){
  if(!S.conn.tried || connOK()) return "";
  var c=S.conn, why;
  why = c.err || "구글 시트에 닿지 못했습니다.";

  var h='<div class="card" style="margin-bottom:14px;border-color:var(--bad)">';
  h+='<div class="eyebrow" style="color:var(--bad)">기록을 불러오지 못했습니다</div>';
  h+='<p class="muted" style="margin:6px 0 10px;color:var(--fg)">'+esc(why)+'</p>';
  h+='<p class="tiny" style="margin-bottom:10px">시트에 저장된 기록이 지워진 것은 아닙니다. 연결되면 그대로 나타납니다.</p>';
  h+='<div class="metrics">'
   +'<div class="metric" style="grid-column:span 2"><b style="font-size:13px;font-family:var(--fBody);color:'+(c.db?"var(--ok)":"var(--bad)")+'">'+(c.db?"연결됨":"끊김")+'</b><span>구글 시트</span></div>'
   +'<div class="metric"><b style="font-size:13px;font-family:var(--fBody);color:'+(ready.ai?"var(--ok)":"var(--fg3)")+'">'+(ready.ai?"준비됨":"불가")+'</b><span>AI 코칭</span></div>'
   +'<div class="metric"><b style="font-size:13px;font-family:var(--fBody);color:'+(ready.img?"var(--ok)":"var(--fg3)")+'">'+(ready.img?"가능":"불가")+'</b><span>사진 판독</span></div></div>';
  h+='<button class="btn primary full" style="margin-top:12px" data-act="reconnect"'+(S.conn.retrying?" disabled":"")+'>'
   +(S.conn.retrying?'<span class="spin"></span> 다시 연결하는 중':'다시 연결')+'</button>';
  h+='<p class="tiny" style="margin-top:10px">계속 안 되면 웹앱 주소를 새로 열어 구글 계정 접근을 허용했는지 확인하세요.</p>';
  h+='</div>';
  return h;
}

         +(S.busy.seed?'<span class="spin"></span> 넣는 중':'표준 13개 넣기')+'</button>'
         +'<p class="tiny" style="margin-top:10px;color:var(--fg3)">로프트와 브랜드는 넣은 뒤 각자 고치면 됩니다.</p></div>')
      : '<div class="card empty"><h3>클럽 목록을 불러오지 못했습니다</h3><p>위의 다시 연결을 눌러 주세요.</p></div>';

      var list=S.clubs.filter(function(c){return c.cat===cat;});

      h+='<div class="card"><div class="eyebrow">'+CAT[cat]+'</div><div style="margin-top:4px">';

        var issue=(c.issues&&c.issues.length)?c.issues.length:0;

      if(tight.length) h+='<div class="banner warn" style="margin-top:12px">'+tight.map(function(r){return r.c.name;}).join(", ")+' 구간의 거리 간격이 8m 미만입니다.</div>';

  }

  return h;

  try{

    if(p0){
      var D=S.preDiag;
      P={head:p0.primary.head,
         goal:String(S.preGoal||"").trim()||null,
         diag:(D&&D.diag)||null,
         cue:(D&&D.cue)||(p0.cue?p0.cue.t:null), cueWhy:p0.cue?p0.cue.d:null,
         plan:p0.plan.map(function(x){ return {m:x.m,t:x.t,d:x.d}; }),
         skip:p0.skip.length?(p0.skip[0].x.c.name+"은 오늘 빼십시오 — "+p0.skip[0].why):null,
         test:(D&&D.test)||p0.test||null};
    }
  }catch(e){}
  return {id:uuid(),date:today(),step:0,warmup:[],cooldown:[],blocks:[],feeling:"",coaching:"",
    cur:{clubId:"",m:{}},editing:false, plan:P, planDone:[], setSize:10, mode:"집중"};
}
/* 연습하는 내내 눈앞에 두는 띠. 손에 채를 들고 보는 것이라 크고 짧게 쓴다.
   계획은 연습을 시작할 때 한 번 굳혀 draft 에 담는다. 중간에 기록이 쌓였다고
   오늘 할 일이 바뀌면 혼란스럽다. */
/* 지금 어느 구간인지 보고 타수와 방식을 맞춰 둔다. 손으로 바꿀 일을 없앤다. */
function syncModeToPlan(){
  var d=S.draft; if(!d||!d.plan) return;
  var done=d.planDone||[], nx=null;
  for(var i=0;i<d.plan.plan.length;i++) if(done.indexOf(i)<0){ nx=d.plan.plan[i]; break; }
  if(!nx) return;
  if(nx.t==="섞어치기"){ d.mode="섞어"; d.setSize=5; }
  else if(nx.t!=="쉬기" && nx.t!=="몸풀기" && nx.t!=="9홀"){ d.mode="집중"; d.setSize=10; }
}

function todayStrip(d){
  var P=d.plan||null;
  if(!P) return '';
  var done=d.planDone||[];
  var h='<div class="card" style="background:var(--accentSoft)">';
  h+='<div class="spread"><div class="eyebrow" style="color:var(--accent)">오늘 할 것</div>'
   +'<button class="btn ghost sm" data-act="stripToggle">'+(S.stripOpen?'접기':'펼치기')+'</button></div>';

  h+='<h3 style="font-size:19px;margin:6px 0 2px">'+esc(P.head)+'</h3>';
  if(P.goal) h+='<p class="tiny" style="margin-top:2px;white-space:normal">내가 적은 것 — '+esc(P.goal)+'</p>';
  if(P.cue){
    h+='<p style="margin-top:4px;font-size:15px"><b>생각 하나 — '+esc(P.cue)+'</b></p>';
    if(S.stripOpen&&P.cueWhy) h+='<p class="tiny" style="margin-top:2px;white-space:normal">'+esc(P.cueWhy)+'</p>';
  }

  /* 다음에 칠 것 하나만 크게 */
  var nextI=-1;
  for(var i=0;i<P.plan.length;i++) if(done.indexOf(i)<0){ nextI=i; break; }
  if(nextI>=0){
    var nx=P.plan[nextI];
    h+='<div class="note" style="margin-top:10px;background:var(--surface)">'
     +'<div class="spread"><div><b style="font-size:16px">지금 → '+esc(nx.t)+'</b>'
     +'<div class="tiny" style="margin-top:2px;color:var(--fg2);white-space:normal">'+esc(nx.d)+'</div></div>'
     +'<button class="btn primary sm" style="flex:none" data-act="stripDone" data-i="'+nextI+'">'+nx.m+'분 끝</button></div></div>';
  } else {
    h+='<div class="banner ok" style="margin-top:10px">오늘 계획을 다 돌았습니다.</div>';
  }

  if(S.stripOpen){
    h+='<div style="margin-top:8px">';
    P.plan.forEach(function(x,i){
      var on=done.indexOf(i)>=0;
      h+='<div class="listrow" style="cursor:pointer;padding:9px 0;opacity:'+(on?'.45':'1')+'" '
       +'data-act="stripDone" data-i="'+i+'">'
       +'<span class="grade '+(on?'A':'X')+'" style="font-family:var(--fData);font-size:12px">'+(on?'✓':x.m)+'</span>'
       +'<div class="bd"><b style="'+(on?'text-decoration:line-through':'')+'">'+esc(x.t)+'</b>'
       +'<span style="white-space:normal;color:var(--fg2)">'+esc(x.d)+'</span></div></div>';
    });
    h+='</div>';
    if(P.diag) h+='<div class="note" style="margin-top:8px;background:var(--surface)">'+esc(P.diag)+'</div>';
    if(P.skip) h+='<div class="banner warn" style="margin-top:8px">'+esc(P.skip)+'</div>';
    if(P.test) h+='<div class="note" style="margin-top:8px;background:var(--surface)">'+esc(P.test)+'</div>';
  }
  return h+'</div>';
}

function drawSparks(){
  var cs=document.querySelectorAll("canvas.spark");
  for(var i=0;i<cs.length;i++){
    (function(cv){
      var data; try{ data=JSON.parse(cv.getAttribute("data-series")||"[]"); }catch(e){ data=[]; }
      if(!data.length) return;
      var dpr=window.devicePixelRatio||1, w=cv.clientWidth||300, hh=76;
      cv.width=w*dpr; cv.height=hh*dpr;
      var x=cv.getContext("2d"); x.scale(dpr,dpr);
      var cs2=getComputedStyle(document.documentElement);
      var acc=cs2.getPropertyValue("--accent").trim()||"#BF4F19";
      var line=cs2.getPropertyValue("--line").trim()||"#ddd";
      var ok=cs2.getPropertyValue("--ok").trim()||"#1C7A58";
      var lo=parseFloat(cv.getAttribute("data-lo")), hi=parseFloat(cv.getAttribute("data-hi"));
      var vals=data.slice(); if(isFinite(lo)) vals.push(lo); if(isFinite(hi)) vals.push(hi);
      var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      if(mx-mn<1){ mx=mn+1; }
      var pad=(mx-mn)*0.18; mn-=pad; mx+=pad;
      var P=10, W=w-P*2, H=hh-P*2;
      function px(i){ return P + (data.length===1? W/2 : W*i/(data.length-1)); }
      function py(v){ return P + H*(1-(v-mn)/(mx-mn)); }
      if(isFinite(lo)&&isFinite(hi)){
        x.fillStyle=ok; x.globalAlpha=.12;
        x.fillRect(P,py(hi),W,Math.max(1,py(lo)-py(hi))); x.globalAlpha=1;
      }
      x.strokeStyle=line; x.lineWidth=1; x.beginPath(); x.moveTo(P,hh-P); x.lineTo(w-P,hh-P); x.stroke();
      x.strokeStyle=acc; x.lineWidth=2.2; x.lineJoin="round"; x.beginPath();
      data.forEach(function(v,i){ i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)); }); x.stroke();
      data.forEach(function(v,i){
        var lastI=i===data.length-1;
        x.beginPath(); x.arc(px(i),py(v),lastI?4.2:2.6,0,6.3);
        x.fillStyle=acc; x.fill();
        if(lastI){ x.fillStyle=cs2.getPropertyValue("--surface").trim()||"#fff";
          x.beginPath(); x.arc(px(i),py(v),1.8,0,6.3); x.fill(); }
      });
    })(cs[i]);
  }
}

function pickBlockClub(i,cid){
  if(!cid) return;
  var c=S.clubs.filter(function(x){ return x.id===cid; })[0];
  var b=S.draft&&S.draft.blocks&&S.draft.blocks[i];
  if(!c||!b) return;
  var prev=lastBlockFor(c.id);
  var ev=evalBlock(c,b.m,prev?prev.m:null);
  b.clubId=c.id; b.clubName=c.name;
  b.good=ev.good; b.bad=ev.bad; b.deltas=ev.deltas; b.needClub=false;
  render();
}

   +"진단: 하고 싶다는 것이 지금 기록에서 타당한지 2~3문장. 기록이 다른 곳을 가리키면 그렇게 말하고 이유를 숫자로 대세요. 비위를 맞추지 마세요.\n"
   +"중심: 오늘 중심으로 삼을 클럽 이름 하나만. 위 클럽 이름 목록에 있는 그대로 쓰세요.\n"
   +"생각: 오늘 들고 갈 스윙 생각 한 가지. 짧게.\n"
   +"판정: 오늘 성공인지 가를 숫자와 세는 방법.\n"
   +"기록에 없는 숫자는 만들지 마세요.";
  ask("pdx",p,{modelTier:"default"}).then(function(t){
    var o={diag:"",clubName:"",cue:"",test:""};
    String(t).split("\n").forEach(function(line){
      var m=/^\s*(진단|중심|생각|판정)\s*[:：]\s*(.+)$/.exec(line);
      if(!m) return;
      if(m[1]==="진단") o.diag=m[2].trim();
      else if(m[1]==="중심") o.clubName=m[2].trim();
      else if(m[1]==="생각") o.cue=m[2].trim();
      else o.test=m[2].trim();
    });
    if(!o.diag) o.diag=String(t).trim();
    S.preDiag=o;
    if(o.clubName){
      var hit=S.clubs.filter(function(c){ return c.name===o.clubName; })[0] || guessClub(o.clubName);
      if(hit){ S.preFocus=hit.id; o.clubName=hit.name; }
      else o.clubName="";
    }
    render();
  }).catch(function(){});
}

function askContext(scope){
  if(scope==="rounds"){
    var rs=S.rounds.filter(function(r){ return r.score!=null; }).slice(0,8);
    if(!rs.length) return "라운드 기록이 없습니다.";
    return "라운드 기록 "+rs.length+"회\n"+rs.map(function(r){
      var t=holeTally(r);
      return "· "+fmtDate(r.date)+" "+(r.type==="field"?"필드":"스크린")+(r.course?(" "+r.course):"")
        +" "+r.score+"타"+(r.par?("(파 "+r.par+", "+(r.score-r.par>0?"+":"")+(r.score-r.par)+")"):"")
        +(r.putts!=null?(" 퍼팅"+r.putts):"")+(r.fw!=null?(" 페어웨이"+r.fw+"/14"):"")
        +(r.gir!=null?(" 그린"+r.gir+"/18"):"")+(r.ob!=null?(" OB"+r.ob):"")+(r.penalty!=null?(" 벌타"+r.penalty):"")
        +(t.n>=18?(" 전반"+t.out+"/후반"+t.inn+" 더블이상"+t.dbl+"홀"):"")
        +(r.note?(" 메모: "+String(r.note).slice(0,60)):"");
    }).join("\n");
  }
  if(scope==="clubs"){
    var rows=S.clubs.filter(function(c){ return c.cat!=="putter"; }).map(function(c){
      var b=lastBlockFor(c.id), T=TARGET[tkey(c)];
      return "· "+c.name+(c.loft!=null?(" "+c.loft+"도"):"")+(c.spare?" (예비)":"")
        +(b?(" — "+metricSummary(b.m)):" — 측정 없음")
        +(T&&b&&b.m.carry!=null&&b.m.carry<T.carry[0]?(" / 목표 "+T.carry[0]+"~"+T.carry[1]+"m 미달"):"");
    });
    return "가방 "+S.clubs.length+"개\n"+rows.join("\n");
  }
  var ss=S.sessions.slice(0,6);
  if(!ss.length) return "연습 기록이 없습니다.";
  return "연습 기록 "+S.sessions.length+"회 중 최근 "+ss.length+"회\n"+ss.map(function(x){
    return "· "+fmtDate(x.date)+" — "+((x.blocks||[]).map(function(b){
      return b.clubName+(b.mode==="섞어"?"(섞어)":"")+" "+(b.m&&b.m.carry!=null?r1(b.m.carry)+"m":"—")
        +(b.m&&b.m.grade?("/"+b.m.grade):"");
    }).join(", ")||"세트 없음")
      +(x.feeling?(" / 느낀점: "+String(x.feeling).slice(0,70)):"");
  }).join("\n");
}

function prescribe(){
  var live=S.clubs.filter(function(c){ return !c.spare && c.cat!=="putter"; });
  var P={primary:null, also:[], skip:[], cue:null, test:null, why:[], plan:[], min:planMin(), holes9:planHoles()};
  if(!live.length) return null;

  /* 클럽마다 상태를 모은다 */
  var info=live.map(function(c){
    var b=lastBlockFor(c.id), T=TARGET[tkey(c)], d=lastDateFor(c.id);
    var off=[];
    if(b&&T){
      if(b.m.carry!=null&&b.m.carry<T.carry[0]) off.push({k:"캐리",v:r1(b.m.carry)+"m",want:T.carry[0]+"~"+T.carry[1]+"m"});
      if(b.m.width!=null&&T.width&&b.m.width>T.width[1]) off.push({k:"좌우 편차",v:r1(b.m.width)+"m",want:T.width[1]+"m 이하"});
      if(b.m.depth!=null&&T.depth&&b.m.depth>T.depth[1]) off.push({k:"앞뒤 편차",v:r1(b.m.depth)+"m",want:T.depth[1]+"m 이하"});
      if(b.m.dir!=null&&T.dir!=null&&Math.abs(b.m.dir)>T.dir) off.push({k:"방향각",v:numToLR(b.m.dir)+"°",want:"±"+T.dir+"° 이내"});
    }
    return {c:c, b:b, T:T, days:daysSince(d), off:off,
            grade:(b&&b.m.grade)||null, carry:(b&&b.m.carry!=null)?b.m.carry:null};
  });

  /* 내가 직접 고른 채가 있으면 그것이 오늘의 중심이다. 앱 판단보다 앞선다. */
  var picked=S.preFocus ? info.filter(function(x){ return x.c.id===S.preFocus; })[0] : null;
  if(picked){
    P.primary={x:picked, kind:"picked", head:picked.c.name+" 집중",
      why:"오늘은 이 채로 가기로 하셨습니다."
         +(picked.off.length?(" 지금 "+picked.off.map(function(o){ return o.k+" "+o.v; }).join(", ")+"가 기준 밖입니다."):"")};
    P.test=picked.off.length ? ("성공 판정: "+picked.off[0].k+"가 "+picked.off[0].want+" 안으로")
                             : "성공 판정: 10발 평균이 기록된다";
  }

  /* A. 거리 역전 — 로프트가 큰 채가 더 멀리 간다. 코스에서 클럽을 고를 수 없게 된다 */
  var byLoft=info.filter(function(x){ return x.carry!=null && x.c.loft!=null; })
                 .sort(function(a,b){ return a.c.loft-b.c.loft; });
  var flip=null;
  for(var i=0;i<byLoft.length-1 && !flip;i++){
    for(var j=i+1;j<byLoft.length;j++){
      if(byLoft[j].carry >= byLoft[i].carry - 1){ flip={lo:byLoft[i], hi:byLoft[j]}; break; }
    }
  }
  if(flip && !picked){
    P.primary={x:flip.hi, kind:"flip",
      head:flip.hi.c.name+" 거리 다시 재기",
      why:flip.hi.c.name+"("+flip.hi.c.loft+"도)가 "+r1(flip.hi.carry)+"m, "
         +flip.lo.c.name+"("+flip.lo.c.loft+"도)가 "+r1(flip.lo.carry)+"m입니다. "
         +"로프트가 큰 채가 더 멀리 나간 기록이라 거리표가 성립하지 않습니다. "
         +"두 채를 같은 날, 같은 피로도에서 다시 재야 합니다."};
    P.also.push({x:flip.lo, why:"같은 세션에서 함께 재야 비교가 성립합니다"});
    P.test="성공 판정: "+flip.hi.c.name+" 캐리 < "+flip.lo.c.name+" 캐리";
  }

  /* B. 라운드가 가리키는 곳 */
  var r0=S.rounds.filter(function(r){ return r.score!=null; })[0];
  var rSig=[];
  if(r0){
    if(r0.gir!=null&&r0.gir<=6) rSig.push({t:"short", s:"그린 적중 "+r0.gir+"/18 — 열"+(18-r0.gir>=15?"다섯":"몇")+" 홀 이상을 웨지로 수습했습니다"});
    if(r0.putts!=null&&r0.putts>=36) rSig.push({t:"putt", s:"퍼팅 "+r0.putts+"개 — 그린에서도 새고 있습니다"});
    if((r0.ob||0)+(r0.penalty||0)>=4) rSig.push({t:"tee", s:"OB·벌타 "+((r0.ob||0)+(r0.penalty||0))+"개 — 티샷이 경기를 무너뜨립니다"});
    var tl=holeTally(r0);
    if(tl.dbl>=8) rSig.push({t:"dbl", s:"더블 이상 "+tl.dbl+"홀 — 한 번 흔들리면 크게 잃습니다"});
  }

  /* C. 측정이 비었거나 오래됐다 */
  var stale=info.filter(function(x){ return !x.b || (x.days!=null&&x.days>=21); })
                .sort(function(a,b){ return (b.days==null?999:b.days)-(a.days==null?999:a.days); });

  /* D. 기준 밖이 가장 많은 클럽 */
  var worst=info.filter(function(x){ return x.off.length; })
                .sort(function(a,b){ return b.off.length-a.off.length; })[0];

  if(!P.primary){
    var wedge=info.filter(function(x){ return x.c.cat==="wedge"; })[0];
    if(rSig.some(function(z){return z.t==="short";}) && wedge){
      P.primary={x:wedge, kind:"short", head:wedge.c.name+" 거리 만들기",
        why:"그린 적중이 "+r0.gir+"/18입니다. 놓친 홀은 전부 웨지로 처리해야 했습니다. "
           +"라운드에서 퍼터 다음으로 많이 쓴 채인데 거리가 정해져 있지 않습니다."};
      P.test="성공 판정: 풀·하프·쿼터 세 거리가 각각 10발 평균으로 적힌다";
    } else if(stale.length){
      var st=stale[0];
      P.primary={x:st, kind:"stale", head:st.c.name+" 측정",
        why: st.b ? (st.days+"일째 기록이 없습니다. 지금 상태를 모르는 채로 다른 것을 고칠 수 없습니다.")
                  : "아직 한 번도 재지 않았습니다. 기준이 없으면 좋아졌는지 나빠졌는지 알 수 없습니다."};
      P.test="성공 판정: 10발 평균이 기록된다";
    } else if(worst){
      P.primary={x:worst, kind:"off", head:worst.c.name+" 교정",
        why:worst.off.map(function(o){ return o.k+" "+o.v+"(목표 "+o.want+")"; }).join(", ")+" — 기준을 벗어나 있습니다."};
      P.test="성공 판정: "+worst.off[0].k+"가 "+worst.off[0].want+" 안으로";
    }
  }
  if(!P.primary) return null;

  /* 보조 — 기준자 한 채와, 확인이 필요한 한 채 */
  var ruler=info.filter(function(x){
    return x!==P.primary.x && x.b && !x.off.length && (x.grade==="A"||x.grade==="B");
  }).sort(function(a,b){ return (a.grade==="A"?0:1)-(b.grade==="A"?0:1); })[0];
  if(ruler) P.also.push({x:ruler, why:"지금 가장 잘 맞는 채입니다. 오늘 컨디션이 정상인지 재는 기준자로 씁니다"});
  var confirm=info.filter(function(x){
    return x!==P.primary.x && x!==(ruler||{}) && x.b && x.grade==="A" && clubSeries(x.c.id,"carry").length<=2;
  })[0];
  if(confirm) P.also.push({x:confirm, why:"지난번 좋았지만 기록이 한두 번뿐입니다. 진짜인지 한 번 더 봅니다"});

  /* 뺄 것 — 정렬이 흔들리는 드라이버는 짧은 날에 득이 없다 */
  var drv=info.filter(function(x){ return x.c.cat==="driver"; })[0];
  if(drv && drv!==P.primary.x && drv.off.length && P.min<=120){
    var kinds=drv.off.map(function(o){ return o.k; }).join("·");
    P.skip.push({x:drv, why:kinds+"가 벗어나 있는데, 이건 스틱을 놓고 봐야 잡힙니다. "
      +"체력도 가장 많이 쓰므로 지친 상태로 치면 나쁜 자세가 굳습니다. 오늘은 빼거나 맨 마지막 10발만."});
  }

  /* 생각은 하나만 */
  var feel=(S.sessions[0]&&S.sessions[0].feeling)||"";
  var cues=["왼팔","어깨","머리","정렬","톱","체중","손목","그립"];
  var hit=cues.filter(function(k){ return feel.indexOf(k)>=0; });
  if(hit.length>=2){
    P.cue={t:"톱에서 잠시 멈춤", d:"지난 느낀점에 신경 쓴 동작이 "+hit.length+"개 적혀 있습니다. "
      +"생각이 둘을 넘으면 스윙이 느려집니다. 오늘은 이것 하나만."};
  } else {
    var o0=(P.primary.x.off||[])[0];
    if(o0&&o0.k==="앞뒤 편차") P.cue={t:"톱에서 잠시 멈춤", d:"앞뒤 편차는 대개 템포가 급해서 생깁니다"};
    else if(o0&&(o0.k==="방향각"||o0.k==="좌우 편차")) P.cue={t:"헤드를 먼저 놓고 발은 나중에", d:"공 앞 30~50cm 표식에 헤드 면을 맞추고, 그다음 발을 그 면에 맞춰 섭니다"};
    else if(o0&&o0.k==="캐리") P.cue={t:"톱에서 잠시 멈춤", d:"멈추는 그 순간에 왼팔이 펴지는 것을 느끼면 아크가 돌아옵니다"};
    else P.cue={t:"톱에서 잠시 멈춤", d:"지금 유일하게 들고 갈 생각입니다"};
  }

  /* 시간 배분 — 오늘의 방향과 몸, 그리고 남은 시간이 함께 정한다 */
  var m=P.min, warm=bodyOf(preBody()).w;
  /* 9홀을 돌면 그 자체가 쉬는 구간이 된다. 따로 쉬는 시간을 또 두지 않는다 */
  var h9=P.holes9?HOLE9:0;
  var rest=(!P.holes9 && m>=100)?10:0;
  var left=m-warm-rest-h9;
  P.tight = left<25;
  var r5=function(v){ return Math.max(5,Math.round(v/5)*5); };

  /* 여는 채 — 몸풀기 다음 처음 잡는 한 채.
     중심이 긴 채이거나 몸이 뻐근하면, 식은 몸으로 바로 들어가지 않는다.
     그 숫자는 그날 스윙이 아니라 그날 긴장이 된다.
     다만 짧은 날에는 그럴 자리가 없다. 그때는 중심으로 곧장 간다. */
  var cold = preBody()==="stiff";
  var longMain = (P.primary.x.c.cat==="driver"||P.primary.x.c.cat==="wood"||P.primary.x.c.cat==="hybrid")
               || (P.primary.x.c.loft!=null && P.primary.x.c.loft<=27);
  /* 몸이 뻐근한 날은 시간이 짧아도 건너뛰지 않는다. 그날은 이게 더 중요하다. */
  if((left>=50 || cold) && (longMain||cold)){
    /* 7번 아이언 근처 — 가장 치기 쉬운 길이에서 결을 깨운다.
       뒤에서 재기로 한 채와 겹치지 않는 쪽을 먼저 고른다 */
    var alsoIds=P.also.map(function(a){ return a.x.c.id; });
    var midPool=info.filter(function(x){
      return x!==P.primary.x && x.c.loft!=null && x.c.loft>=28 && x.c.loft<=40;
    }).sort(function(a,b){
      var da=(alsoIds.indexOf(a.c.id)<0?0:100)+Math.abs(a.c.loft-34);
      var db=(alsoIds.indexOf(b.c.id)<0?0:100)+Math.abs(b.c.loft-34);
      return da-db;
    });
    var mid=midPool[0]
     || info.filter(function(x){ return x!==P.primary.x && x.c.cat==="wedge"; })[0];
    if(mid){
      var om=Math.max(10,Math.min(20,r5(left*0.15)));
      left-=om;
      P.open={x:mid, m:om,
        why:(cold&&longMain)
          ? "몸이 뻐근하다고 하셨는데 오늘 중심은 "+P.primary.x.c.name+"입니다. 긴 채를 식은 몸으로 처음 잡으면 그날 스윙이 아니라 그날 굳은 몸이 기록됩니다."
          : (cold ? "몸이 뻐근하다고 하셨습니다. 짧은 채로 결을 먼저 깨우고 들어갑니다."
                  : P.primary.x.c.name+"는 몸이 다 열린 뒤에 잡아야 숫자가 맞습니다. 먼저 이 채로 오늘의 생각을 몸에 넣습니다.")};
    }
  }

  /* 남은 시간이 짧을수록 중심에 몰고, 길수록 고르게 편다 */
  var mainPct = left<40 ? 0.75 : (left<70 ? 0.6 : 0.5);
  var mainShare = P.also.length ? r5(left*mainPct) : left;
  /* 한 구간이 10분 밑으로 내려가면 연습이 아니라 거쳐가기다. 그럴 바엔 보조를 줄인다 */
  while(P.also.length && Math.floor((left-mainShare)/P.also.length/5)*5 < 10){
    P.also.pop();
    if(!P.also.length) mainShare=left;
  }
  var n=1+P.also.length;
  var each = n>1 ? Math.floor((left-mainShare)/(n-1)/5)*5 : 0;
  P.plan.push({m:warm, t:"몸풀기",
    d:(preBody()==="stiff")
      ? "체온부터 올립니다 — 제자리 걷기 1분 뒤에 늘리세요. 찬 몸은 늘리면 다칩니다. 첫 10발은 웨지 반스윙."
      : "어깨·허리·손목. 첫 10발은 반스윙"});
  if(P.open){
    P.plan.push({m:P.open.m, t:P.open.x.c.name, fix:true, tag:"열기",
      d:"여는 채입니다. 반스윙 10발 → 풀스윙 10발. 숫자는 보지 말고 "
       +(P.cue?P.cue.t:"리듬")+"만 보세요. 여기는 기록하지 않습니다."});
  }
  P.plan.push({m:mainShare, t:P.primary.x.c.name,
    d:(P.primary.kind==="short")?"풀스윙 10발 → 시계 9시 하프 10발 → 시계 8시 쿼터 10발. 각 10발의 캐리 평균을 적습니다"
      :"10발씩 나눠 치고 평균을 적습니다"});
  /* 쉬는 자리는 마지막 구간 직전이다. 끝에 두면 쉬는 뜻이 없다 */
  P.also.forEach(function(a,i){
    if(rest && i===P.also.length-1)
      P.plan.push({m:rest, t:"쉬기", d:"여기서 쉬지 않으면 뒤 기록이 피로 기록이 됩니다"});
    P.plan.push({m:each, t:a.x.c.name, d:a.why});
  });
  if(rest && !P.also.length)
    P.plan.splice(1,0,{m:rest, t:"쉬기", d:"중간에 한 번 숨을 돌립니다"});
  /* 섞어치기 — 같은 채를 연속으로 치지 않는 구간.
     그날은 더 빗맞지만 코스로 옮겨지는 것은 이쪽이다. 측정이 끝난 뒤에 둔다.
     9홀을 도는 날은 9홀이 그 역할을 하므로 따로 두지 않는다. */
  if(!P.holes9 && left>=45){
    var mixM=r5(Math.min(20,left*0.2));
    /* 앞 구간에서 조금씩 떼어 온다 */
    var cut=mixM, order=[];
    for(var pi2=P.plan.length-1;pi2>=0;pi2--) if(P.plan[pi2].t!=="몸풀기"&&P.plan[pi2].t!=="쉬기"&&!P.plan[pi2].fix) order.push(pi2);
    order.forEach(function(ix){
      if(cut<=0) return;
      var take=Math.min(cut, Math.max(0, P.plan[ix].m-15));
      P.plan[ix].m-=take; cut-=take;
    });
    mixM-=cut;
    if(mixM>=10){
      var names=[P.primary.x.c.name].concat(P.also.map(function(a2){ return a2.x.c.name; })).slice(0,3);
      P.plan.push({m:mixM, t:"섞어치기",
        d:"측정기를 5타로 놓고 "+names.join("·")+"를 5타씩 번갈아 칩니다. "
         +"세트마다 결과 화면을 찍어 두면 기록이 남습니다. 매 세트 목표를 바꾸고, 한 발마다 어드레스부터 다시 합니다. "
         +"여기 숫자는 기준에서 빼니 나빠져도 괜찮습니다."});
      P.mixed=true;
    }
  }

  if(P.holes9){
    P.plan.push({m:HOLE9, t:"9홀",
      d:"티샷마다 정렬 루틴을 지킵니다 — 공 뒤에서 목표선 보기 → 앞 50cm 표식 고르기 → 헤드 먼저 놓고 발은 나중. "
       +"두 번째 샷은 오늘 잰 거리만 믿고 채를 고릅니다. 끝나면 페어웨이에 몇 번 올렸는지 세어 두세요."});
  }
  if(P.holes9){
    P.test=(P.test?P.test+" / ":"")+"9홀에서 페어웨이 안착 몇 번인지 세기";
  }
  P.rSig=rSig;
  return P;
}

/* 홀별 타수를 더하고 파 대비를 센다. */
function holeTally(r){
  var hs=r.holes||[], ps=r.pars||[];
  var o={out:0,inn:0,sum:0,par:0,dbl:0,good:0,marks:"",n:0};
  for(var i=0;i<18;i++){
    var v=hs[i], p=ps[i];
    if(v!=null&&!isNaN(v)){ o.sum+=v; o.n++; if(i<9) o.out+=v; else o.inn+=v; }
    if(p!=null&&!isNaN(p)) o.par+=p;
    if(v!=null&&p!=null&&!isNaN(v)&&!isNaN(p)){
      var d=v-p;
      if(d>=2) o.dbl++;
      if(d<=0) o.good++;
      var cls = d<0?"bird":(d===0?"":(d===1?"bogey":"dbl"));
      o.marks+='<i class="'+cls+'">'+(d>0?("+"+d):(d<0?String(d):"E"))+'</i>';
    }
  }
  return o;
}

function holeCard(r){
  var hs=r.holes||[];
  var open = S.openHoles || hs.some(function(v){ return v!=null; });
  if(!open) return '<button class="btn ghost full" data-act="openHoles">홀별 타수 직접 넣기</button>';
  function nine(from){
    var o='<div class="holes"><span class="rl">홀</span>', i;
    for(i=from;i<from+9;i++) o+='<span>'+(i+1)+'</span>';
    o+='<span class="rl">파</span>';
    for(i=from;i<from+9;i++) o+='<input type="number" class="par num" id="rp_'+i+'" inputmode="numeric" value="'+esc((r.pars&&r.pars[i]!=null)?r.pars[i]:"")+'">';
    o+='<span class="rl">타수</span>';
    for(i=from;i<from+9;i++) o+='<input type="number" class="num" id="rh_'+i+'" inputmode="numeric" value="'+esc(hs[i]==null?"":hs[i])+'">';
    return o+'</div>';
  }
  var t=holeTally(r);
  var h='<div class="card"><div class="spread"><div class="eyebrow">홀별 타수</div>'
   +'<button class="btn ghost sm" data-act="closeHoles">접기</button></div>';
  h+='<div style="margin-top:10px">'+nine(0)+'</div><div style="margin-top:12px">'+nine(9)+'</div>';
  if(t.n) h+='<div class="holeSum"><span>OUT <b>'+t.out+'</b></span><span>IN <b>'+t.inn+'</b></span>'
   +'<span>합계 <b>'+t.sum+'</b></span>'+(t.par?('<span>코스 파 '+t.par+'</span>'):'')
   +(t.n<18?('<span>'+t.n+'홀만 들어옴</span>'):'')+'</div>';
  if(t.marks) h+='<div class="hRow">'+t.marks+'</div>';
  h+='<p class="tiny" style="margin-top:8px;color:var(--fg3)">사진에서 읽은 값입니다. 틀린 칸만 고치세요. 합계와 파 대비는 저장할 때 다시 계산합니다.</p>';
  return h+'</div>';
}

/* 화면에 들어온 라운드 값을 상태로 옮긴다. 다시 그려도 쓴 내용이 남는다. */
function readRoundForm(r){
  function g(id){ var e=document.getElementById(id); return e?String(e.value).trim():null; }
  var v;
  if((v=g("rf_date"))!=null) r.date=v||today();
  if((v=g("rf_type"))!=null) r.type=v;
  if((v=g("rf_course"))!=null) r.course=v;
  [["rf_score","score"],["rf_par","par"],["rf_putts","putts"],["rf_fw","fw"],["rf_gir","gir"],

/* 측정 화면에 찍힌 클럽 표시를 내 가방의 클럽에 맞춘다.
   "7I" "#7" "7번" "DR" "W1" "56" "56°" "SW" "UT" "3H" 같은 표기를 받는다. */
function guessClub(raw){
  var t=String(raw||"").toUpperCase().replace(/\s+/g,"");
  if(!t) return null;
  function find(pred){ for(var i=0;i<S.clubs.length;i++){ if(pred(S.clubs[i])) return S.clubs[i]; } return null; }
  function byId(id){ return find(function(c){ return c.id===id; }); }

  /* 드라이버 */
  if(/^(DR|D|W1|1W|드라이버|DRIVER)$/.test(t)){
    return byId("drv") || find(function(c){ return c.cat==="driver" && !c.spare; }) || find(function(c){ return c.cat==="driver"; });
  }
  /* 퍼터 */
  if(/^(PT|PUTTER|퍼터)$/.test(t)) return find(function(c){ return c.cat==="putter"; });
  /* 웨지 — 로프트 숫자 또는 기호 */
  var lw=/(\d{2})\s*°?/.exec(t);
  if(/^(PW|P|피칭)/.test(t)) return byId("pw") || find(function(c){ return /피칭|PW/i.test(c.name||""); });
  if(/^(AW|GW|A|G|갭)/.test(t)) return byId("w48") || find(function(c){ return c.cat==="wedge" && c.loft===48; });
  if(/^(SW|S|샌드)/.test(t)) return byId("w56") || find(function(c){ return c.cat==="wedge" && c.loft===56; });
  if(/^(LW|L|로브)/.test(t)) return find(function(c){ return c.cat==="wedge" && c.loft>=58; });
  if(lw){
    var L=parseInt(lw[1],10);
    if(L>=44 && L<=64){
      var exact=find(function(c){ return c.cat==="wedge" && num(c.loft)===L; });
      if(exact) return exact;
      var near=null, gap=99;
      S.clubs.forEach(function(c){ if(c.cat!=="wedge"||c.loft==null) return;
        var g=Math.abs(num(c.loft)-L); if(g<gap){ gap=g; near=c; } });
      if(near && gap<=1) return near;
    }
  }
  /* 하이브리드·유틸리티 — "3번 하이브리드"처럼 숫자가 앞에 붙으므로 아이언보다 먼저 본다 */
  if(/하이브리드|HYBRID|유틸|^\d?\s*UT$|^UT\d?$|^\d?H$|^H\d?$/.test(t)){
    return byId("hy3") || find(function(c){ return c.cat==="hybrid"; });
  }
  /* 우드 — "3번 우드" */
  if(/우드|WOOD|^\d\s*W$|^W\s*\d$/.test(t) && !/^W1$|^1W$/.test(t)){
    return find(function(c){ return c.cat==="wood"; });
  }
  if(/퍼터|PUTTER/.test(t)) return find(function(c){ return c.cat==="putter"; });
  if(/드라이버|DRIVER/.test(t)) return byId("drv") || find(function(c){ return c.cat==="driver" && !c.spare; });
  /* 아이언 — 4I, #7, 7번, I7 */
  var ir=/(\d)\s*(I|IRON|번|아이언)|^#?(\d)$|^I\s*(\d)$/.exec(t);
  if(ir){
    var n=parseInt(ir[1]||ir[3]||ir[4],10);
    if(n>=3 && n<=9) return byId("i"+n) || find(function(c){ return c.cat==="iron" && new RegExp("^"+n+"번").test(c.name||""); });
  }
  /* 이름이 그대로 적힌 경우 */
  return find(function(c){ return String(c.name||"").toUpperCase().replace(/\s+/g,"")===t; });
}

/* 사진을 한 장씩 차례로 읽는다. 한꺼번에 보내면 구글 쪽에서 막힌다. */
function runMulti(i){
  var M=S.multi;
  if(i>=M.files.length){
    M.busy=false;
    var made=M.log.filter(function(x){ return x.indexOf("→")>0; }).length;
    M.log.push(made ? ("세트 "+made+"개를 만들었습니다.") : "만들어진 세트가 없습니다.");
    M.files=[];                /* 다시 읽지 않도록 비우되, 사진과 결과는 남겨 둔다 */
    render(); return;
  }
  M.at=i+1; render();
  var f=M.files[i], label=(f.name||("사진"+(i+1)));
  sample.json("측정 화면",{images:[f],modelTier:"default"})
  .then(function(v){
    if(!v){ M.bad=true; M.marks[i]="답이 비었음"; M.log.push(label+" — 답이 비었습니다"); return next(); }
    var m={}, got=0;
    METRICS.forEach(function(x){
      if(v[x.k]==null||v[x.k]==="") return;
      var val=x.lr?lrToNum(v[x.k]):num(v[x.k]);
      if(val==null||isNaN(val)) return;
      m[x.k]=val; got++;
    });
    if(v.grade) m.grade=String(v.grade).toUpperCase().slice(0,1);
    if(!got){ M.bad=true; M.marks[i]="숫자 못 읽음"; M.log.push(label+" — 숫자를 못 읽었습니다"); return next(); }
    /* 숫자를 읽었으면 클럽을 못 찾았다고 통째로 버리지 않는다.
       애써 읽은 열한 개 수치를 지우고 다시 넣게 하는 것은 말이 안 된다.
       클럽 자리만 비워 두고 세트는 만든다. 아래에서 고르면 된다. */
    var club=v.club?guessClub(v.club):null;
    var shots=num(v.shots); if(!(shots>0)) shots=(S.draft.setSize||10);
    var mdNow=S.draft.mode||"집중";
    if(!club){
      S.draft.blocks.push({clubId:"",clubName:"",m:m,shots:shots,mode:mdNow,
        good:[],bad:[],deltas:null,coaching:"",needClub:true});
      M.marks[i]="클럽만 고르세요";
      M.log.push(label+" → 숫자는 읽었습니다"+(m.carry!=null?(" (캐리 "+r1(m.carry)+"m)"):"")
        +". 클럽만 아래에서 골라 주세요"+(v.club?(' — 화면에는 "'+v.club+'"로 보입니다'):"")+".");
      return next();
    }
    var prev=lastBlockFor(club.id);
    var ev=evalBlock(club,m,prev?prev.m:null);
    S.draft.blocks.push({clubId:club.id,clubName:club.name,m:m,shots:shots,mode:mdNow,
      good:ev.good,bad:ev.bad,deltas:ev.deltas,coaching:""});
    S.openBlock=S.draft.blocks.length-1;
    M.marks[i]=club.name+(m.carry!=null?(" "+r1(m.carry)+"m"):"");
    M.log.push(label+" → "+club.name+" · 캐리 "+(m.carry!=null?r1(m.carry)+"m":"—")+sizeNote());
    next();
  })
  .catch(function(e){
    M.bad=true; M.marks[i]="실패"; M.log.push(label+" — "+readErr(e));
    next();
  });
  function next(){ render(); setTimeout(function(){ runMulti(i+1); },400); }
}

function readErr(e){
  var m=(e&&(e.message||e.msg))||"";

  if(e&&e.code==="invalid_json") return "사진에서 숫자를 찾지 못했습니다. 화면 전체가 또렷하게 나오도록 다시 찍어 주세요.";

  if(/혼잡|요청이 몰렸|high demand/i.test(m))
    return "구글 모델이 지금 혼잡합니다. 1~2분 뒤 다시 눌러 주세요. 급하면 아래 칸에 직접 넣으셔도 됩니다.";

function blockDetail(b){
  var h='<div class="card" style="margin:0 0 10px;background:var(--surface2)">';
  h+='<div class="metrics">';
  METRICS.forEach(function(x){
    var v=b.m[x.k];
    if(v==null) return;
    h+='<div class="metric"><b>'+(x.lr?numToLR(v,x.k==="side"?0:1):r1(v))+'</b>'
     +'<span>'+esc(x.n)+(x.u?(' '+esc(x.u)):'')+'</span></div>';
  });

  if(b.deltas && Object.keys(b.deltas).length){
    var ds=[];

      if(x.lr) good = Math.abs(dv)<0;           /* 방향·사이드스핀은 방향만 보여준다 */
      ds.push('<span class="chip '+(x.lr?'neutral':(good?'ok':'bad'))+'">'
        +esc(x.n)+' '+(up?'+':'')+r1(dv)+'</span>');
    });
    if(ds.length) h+='<div style="margin-top:10px"><div class="eyebrow">지난번 대비</div>'

      +b.good.map(function(t){ return '<li class="ok">'+esc(t)+'</li>'; }).join('')+'</ul></div>';
  }
  if(b.bad && b.bad.length){

      +b.bad.map(function(t){ return '<li class="bad">'+esc(t)+'</li>'; }).join('')+'</ul></div>';

  }

}


/* ====================== 세트별 이어지는 코칭 ======================
   한 세트를 치면 → 코치가 판정·진단·다음 한 가지·질문을 준다 → 답을 고르면 다시 좁혀 준다
   → 같은 채로 다음 세트를 치면 지난 지시가 효과가 있었는지 숫자로 먼저 판정한다. */
function lcParse(t){
  var o={raw:t||""}, keys={"판정":"verdict","진단":"diag","다음":"next","질문":"q","보기":"opts","답":"ans"};
  String(t||"").split(/\n+/).forEach(function(line){
    var m=line.match(/^\s*[-*·]?\s*(판정|진단|다음|질문|보기|답)\s*[:：]\s*(.*)$/);
    if(m) o[keys[m[1]]]=m[2].trim();
  });
  o.opts=o.opts?o.opts.split(/\s*[|｜\/]\s*/).filter(Boolean).slice(0,4):[];
  if(!o.diag&&!o.next&&!o.ans) o.diag=String(t||"").trim();
  return o;
}

/* 보낸 것이 답인지 되묻는 것인지 가린다.
   되묻는 것을 답으로 받아 버리면, 하지도 않은 동작을 했다고 쓰고
   방금 물어본 것을 또 묻는다. */
function lcIsQuestion(t){
  var s=String(t||"").trim();
  if(!s) return false;
  if(/[?？]/.test(s)) return true;
  /* '뒤땅이 나요' 같은 설명을 질문으로 보지 않도록 어미만으로는 가르지 않는다 */
  return /(어디에|어디를|어디다|어디가|어디쯤|어떻게|어째서|무엇|뭐야|뭐지|뭔가|맞나|맞는지|인가|할까|물어|알려\s*줘|설명해|궁금|왜\s|^왜)/.test(s);
}

/* ---------- 스윙 영상 ----------
   영상을 통째로 보내면 너무 크고, 한 컷만 보내면 스윙이 안 보인다.
   고르게 여덟 컷을 뽑아 한 장으로 붙여 보낸다. */
function videoSheet(file,cb){
  var v=document.createElement("video");
  v.preload="auto"; v.muted=true; v.playsInline=true; v.setAttribute("playsinline","");
  var url; try{ url=URL.createObjectURL(file); }catch(e){ cb(null,"영상을 열지 못했습니다."); return; }
  var done=false;
  function fail(m){ if(done) return; done=true; try{URL.revokeObjectURL(url);}catch(e){} cb(null,m); }
  var guard=setTimeout(function(){ fail("영상을 읽는 데 너무 오래 걸립니다. 더 짧게 찍어 주세요."); },45000);
  v.onerror=function(){ clearTimeout(guard); fail("이 형식의 영상은 읽지 못합니다. 휴대폰 기본 카메라로 찍은 것을 올려 주세요."); };
  v.onloadedmetadata=function(){
    var dur=v.duration;
    if(!isFinite(dur)||dur<=0){ clearTimeout(guard); fail("영상 길이를 알 수 없습니다."); return; }
    if(dur>20){ clearTimeout(guard); fail("영상이 "+Math.round(dur)+"초입니다. 스윙 한 번만 10초 안으로 찍어 주세요."); return; }
    var N=8, cols=4;
    var vw=v.videoWidth||360, vh=v.videoHeight||640;
    var cw=Math.min(300,vw), ch=Math.round(vh*(cw/vw));
    var cv=document.createElement("canvas");
    cv.width=cw*cols; cv.height=ch*Math.ceil(N/cols);
    var cx=cv.getContext("2d");
    cx.fillStyle="#000"; cx.fillRect(0,0,cv.width,cv.height);
    var k=0;
    function step(){
      if(k>=N){
        clearTimeout(guard); done=true;
        try{URL.revokeObjectURL(url);}catch(e){}
        var out=null;
        try{ out=cv.toDataURL("image/jpeg",0.7); }catch(e){}
        cb(out, out?null:"영상에서 그림을 꺼내지 못했습니다.");
        return;
      }
      var t=dur*(k+0.5)/N;
      try{ v.currentTime=Math.min(Math.max(t,0), Math.max(dur-0.05,0)); }
      catch(e){ clearTimeout(guard); fail("영상을 넘기지 못했습니다."); }
    }
    v.onseeked=function(){
      if(done) return;
      var x=(k%cols)*cw, y=Math.floor(k/cols)*ch;
      try{ cx.drawImage(v,x,y,cw,ch); }
      catch(e){ clearTimeout(guard); fail("영상에서 그림을 꺼내지 못했습니다."); return; }
      cx.fillStyle="rgba(0,0,0,.6)"; cx.fillRect(x,y,30,24);
      cx.fillStyle="#fff"; cx.font="bold 16px sans-serif";
      cx.fillText(String(k+1), x+9, y+18);
      k++; step();
    };
    step();
  };
  v.src=url;
}

  }

  ask("lc"+i,p,{modelTier:"default",cache:false}).then(function(t){

    if(o.next) b.coaching=[o.verdict,o.diag||o.ans,"다음: "+o.next].filter(Boolean).join("\n");
    render();

function metricSummary(m){
  return METRICS.filter(function(x){return m[x.k]!=null;})
    .map(function(x){ return x.n+" "+(x.lr?numToLR(m[x.k],x.k==="side"?0:1):m[x.k])+x.u; }).join(", ")
    + (m.grade?(", 등급 "+m.grade):"");
}

      S.busy.key=false; S.msg.key=null;
      ready.ai=true; ready.img=true;
      S.note.sphoto="사진 판독을 켰습니다"+(r&&r.model?(" — "+r.model):"")+". 이제 사진을 올리고 읽기를 누르세요.";
