  if(a==="openHoles"){ readRoundForm(S.sheet.data); S.openHoles=true; render(); return; }
  if(a==="closeHoles"){ readRoundForm(S.sheet.data); S.openHoles=false; render(); return; }

  if(a==="readRoundPhoto"){
    var rf=fileOf("roundPhoto");
    if(!rf){ S.msg.rphoto="사진을 먼저 고르세요."; render(); return; }
    readRoundForm(S.sheet.data);
    S.busy.rphoto=true; S.msg.rphoto=null; S.note.rphoto=null; S.shrunk=null;
    S.stage="사진 줄이는 중"; S.sec=0; render();
    (function tick(){
      if(!S.busy.rphoto) return;
      S.sec++;
      var changed=(S.sec===2||S.sec===5);
      if(S.sec===2) S.stage="보내는 중";
      if(S.sec===5) S.stage="읽는 중";
      if(changed || !tickOnly()) render();
      setTimeout(tick,1000);
    })();
    sample.json("라운드 결과 화면",{images:[rf],modelTier:"default"})
    .then(function(v){
      S.busy.rphoto=false; S.stage=null;
      var r0=S.sheet&&S.sheet.data;
      if(!r0||!v){ S.msg.rphoto="답이 비어 있습니다. 다시 한 번 눌러 주세요."; render(); return; }
      var got=[];

      function arr(x,lo,hi){
        if(!x||!x.length) return null;
        var out=[],any=false;
        for(var i=0;i<18;i++){
          var n2 = (i<x.length) ? num(x[i]) : null;
          if(n2!=null&&(n2<lo||n2>hi)) n2=null;
          out.push(n2); if(n2!=null) any=true;
        }
        return any?out:null;
      }
      /* 파 대비 값은 0이나 음수도 나온다. 변환 뒤에 다시 거른다. */
      var hs=arr(v.holes,-5,15), ps=arr(v.pars,3,6);

      /* 스크린 결과 화면 중에는 Score 줄에 타수가 아니라 파 대비를 적는 것이 있다.
         합이 (총타수 - 코스 파)와 맞으면 그쪽이므로 각 홀의 파를 더해 실제 타수로 돌린다. */
      if(hs&&ps){
        var sH=0,sP=0,nn=0;
        for(var k=0;k<18;k++){ if(hs[k]!=null&&ps[k]!=null){ sH+=hs[k]; sP+=ps[k]; nn++; } }
        var tot=num(v.score);
        var looksRel = (v.relative===true) || (tot!=null && nn>=18 && Math.abs(sH+sP-tot)<=1 && Math.abs(sH-tot)>3);
        if(looksRel&&nn>=9){
          for(var k2=0;k2<18;k2++) if(hs[k2]!=null&&ps[k2]!=null) hs[k2]=hs[k2]+ps[k2];
        }
        for(var k3=0;k3<18;k3++) if(hs[k3]!=null&&(hs[k3]<1||hs[k3]>15)) hs[k3]=null;
      }
      if(hs){ r0.holes=hs; S.openHoles=true; got.push("홀별 타수 "+hs.filter(function(x){return x!=null;}).length+"홀"); }
      if(ps){ r0.pars=ps; }

      if(v.course){ r0.course=String(v.course).slice(0,60); got.push("코스"); }
      if(v.date&&/^\d{4}-\d{2}-\d{2}$/.test(String(v.date).trim())){ r0.date=String(v.date).trim(); got.push("날짜"); }
      if(v.kind==="field"||v.kind==="screen") r0.type=v.kind;

      var t=holeTally(r0);
      [["score","스코어",50,200],["par","파",54,80],["putts","퍼팅",10,60],
       ["fw","페어웨이",0,14],["gir","그린 적중",0,18],["ob","OB",0,30],["penalty","벌타",0,40]]
      .forEach(function(x){
        var n3=num(v[x[0]]);
        if(n3==null||n3<x[2]||n3>x[3]) return;
        r0[x[0]==="penalty"?"penalty":x[0]]=n3; got.push(x[1]);
      });

      /* 홀별이 들어왔으면 합계와 파 대비는 직접 센다. 화면 숫자보다 이게 정확하다. */
      if(t.n>=18){
        if(r0.score==null) r0.score=t.sum;
        if(t.par) r0.par=t.par;
      }
      if(t.marks){ r0.dbl=t.dbl; r0.parOrBetter=t.good; got.push("더블 이상/파 이상"); }

      if(!got.length){
        S.msg.rphoto="읽어낸 값이 없습니다. 홀별 표와 총타수가 한 화면에 또렷하게 들어가도록 다시 찍어 주세요.";
      } else {
        S.msg.rphoto=null;
        var sv = (t.n>=18 && r0.score!=null && t.sum!==r0.score)
          ? " 홀별 합계는 "+t.sum+"타인데 화면 총타수는 "+r0.score+"타입니다. 둘 중 맞는 쪽으로 고치세요." : "";
        S.note.rphoto="읽었습니다 — "+got.join(", ")+"."+sv
          +(v._ms?(" 서버 "+Math.round(v._ms/1000)+"초"+(v._model?" · "+v._model:"")):"");
      }
      render();
    })
    .catch(function(e){
      S.busy.rphoto=false; S.stage=null;
      var em=(e&&e.message)?String(e.message):"";
      S.msg.rphoto = /알 수 없는 요청/.test(em)
        ? "서버가 아직 라운드 사진 읽기를 모릅니다. 앱스 스크립트에 새 Code.gs 를 붙여넣고 새 버전으로 배포해 주세요."
        : (em || "사진을 읽지 못했습니다. 직접 넣어 주세요.");
      render();
    });
    return;
  }

  if(a==="readShotPhoto"){
    var sf=fileOf("shotPhoto");
    if(!sf){ S.msg.sphoto="사진을 먼저 고르세요."; render(); return; }
    readBlockForm(S.sheet.data);
    S.busy.sphoto=true; S.msg.sphoto=null; S.note.sphoto=null; S.shrunk=null;
    S.stage="사진 줄이는 중"; S.sec=0; render();
    (function tick(){
      if(!S.busy.sphoto) return;
      S.sec++;
      var changed=(S.sec===2||S.sec===5);
      if(S.sec===2) S.stage="보내는 중";
      if(S.sec===5) S.stage="읽는 중";
      if(changed || !tickOnly()) render();
      setTimeout(tick,1000);
    })();
    sample.json("측정 화면",{images:[sf],modelTier:"default"})
    .then(function(v){
      S.busy.sphoto=false; S.stage=null;
      var b=S.sheet&&S.sheet.data; if(!b||!v){ S.msg.sphoto="답이 비어 있습니다. 다시 한 번 눌러 주세요."; render(); return; }
      var got=0;
      METRICS.forEach(function(x){
        if(v[x.k]==null||v[x.k]==="") return;
        var val = x.lr ? lrToNum(v[x.k]) : num(v[x.k]);
        if(val==null||isNaN(val)) return;
        b.m[x.k]=val; got++;
      });
      if(v.grade) b.m.grade=String(v.grade).toUpperCase().slice(0,1);
      if(v.shots!=null){ var sn=num(v.shots); if(sn>0) b.shots=sn; }

      /* 사진에 찍힌 클럽으로 자동 선택 */
      var hit=null;
      if(v.club){ hit=guessClub(v.club); if(hit) b.clubId=hit.id; }

      if(!got){
        S.msg.sphoto="숫자를 하나도 못 읽었습니다. 화면 전체가 들어가게, 글자가 또렷하게 다시 찍어 주세요.";
      } else {
        S.msg.sphoto=null;
        S.note.sphoto = "사진에서 "+got+"개 항목을 읽었습니다"+sizeNote()
          + (v._ms?(" 서버 "+Math.round(v._ms/1000)+"초"+(v._model?(" · "+v._model):"")):"") + "."
          + (hit ? (" 클럽은 "+hit.name+"으로 잡았습니다.")
                 : (v.club ? (" 화면의 클럽 표시 \""+v.club+"\"는 가방에서 못 찾아 직접 골라 주세요.")
                           : " 클럽 표시가 안 보여 직접 골라 주세요."));
      }
      render();
    }).catch(function(e){ S.busy.sphoto=false; S.stage=null;
      S.msg.sphoto = readErr(e);
      render(); });
    return;
  }

  if(a==="saveBlock"){
    var b2=readBlockForm(S.sheet.data);
    var club2=S.clubs.filter(function(x){return x.id===b2.clubId;})[0];
    if(!club2){ flash("클럽을 선택하세요."); return; }
    var prev=lastBlockFor(b2.clubId);
    var ev2=evalBlock(club2,b2.m,prev?prev.m:null);
    S.draft.blocks.push({clubId:b2.clubId,clubName:club2.name,m:b2.m,
      shots:(b2.shots||S.draft.setSize||10), mode:(S.draft.mode||"집중"),
      good:ev2.good,bad:ev2.bad,deltas:ev2.deltas,coaching:""});
    S.openBlock=S.draft.blocks.length-1;
    S.sheet=null; S.sheetShown=null; render(); return;
  }

  if(a==="coachFeel"){
    var fb2=document.getElementById("feelBox"); if(fb2) S.draft.feeling=fb2.value;
    if(!S.draft.feeling.trim()){ S.msg.feel="느낀점을 먼저 적어 주세요."; render(); return; }
    var blocksTxt=S.draft.blocks.map(function(b){
      return b.clubName+": "+metricSummary(b.m)+(b.bad.length?(" / 기준 밖: "+b.bad.join("; ")):" / 전 항목 기준 안");
    }).join("\n");
    var p4=profileText()+"\n\n오늘 연습 기록:\n"+(blocksTxt||"측정 없음")
      +"\n\n본인이 적은 느낀점:\n"+S.draft.feeling
      +"\n\n느낀점과 측정 숫자가 일치하는지 먼저 확인하고, 다음 연습에서 바꿀 것 한 가지만 지정하세요. "
      +"느낌이 숫자와 다르면 그 점을 분명히 말하세요. 350자 이내, 머리말 없이 바로 시작.";
    ask("feel",p4,{modelTier:"default",cache:false}).then(function(t){ S.draft.coaching=t; render(); }).catch(function(){});
    return;
  }

  if(a==="saveSession"){
    var d2=S.draft;
    var rec={id:d2.id,date:d2.date,warmup:d2.warmup,cooldown:d2.cooldown,blocks:d2.blocks,
      feeling:d2.feeling,coaching:d2.coaching,createdAt:new Date().toISOString()};
    put("sessions",rec).then(function(){
      S.draft=null; S.resumed=false; dropDraft();
      S.tab="practice"; S.jump=true; render(); window.scrollTo(0,0);
    });
    return;
  }
  if(a==="delSession"){ del("sessions",el.getAttribute("data-id")).then(function(){ S.sheet=null; S.sheetShown=null; render(); }); return; }

  if(a==="coachBlock"){
    var si=el.getAttribute("data-si"), bi=+el.getAttribute("data-bi");
    var ses=S.sessions.filter(function(x){return x.id===si;})[0]; if(!ses) return;
    var blk=ses.blocks[bi]; var cl=S.clubs.filter(function(x){return x.id===blk.clubId;})[0];
    var T2=TARGET[tkey(cl)];
    var prev2=lastBlockFor(blk.clubId,si);
    var p5=profileText()+"\n\n클럽: "+blk.clubName+(cl?(" ("+[cl.brand,cl.model,cl.loft?cl.loft+"도":"",cl.shaft,cl.flex].filter(Boolean).join(" ")+")"):"")
      +"\n이번 10회 평균: "+metricSummary(blk.m)
      +(prev2?("\n직전 기록("+fmtDate(prev2.date)+"): "+metricSummary(prev2.m)):"\n직전 기록 없음")
      +(T2?("\n목표: 캐리 "+T2.carry[0]+"~"+T2.carry[1]+"m, 발사각 "+T2.launch[0]+"~"+T2.launch[1]+"도, 백스핀 "+T2.back[0]+"~"+T2.back[1]+", 좌우 편차 "+T2.width[1]+"m 이하, 방향각 ±"+T2.dir+"도 이내"):"")
      +"\n\n세 줄로 답하세요. 각 줄은 '향상:', '부족:', '다음:'으로 시작합니다. "
      +"'다음:'에는 다음 10발에서 바꿀 동작 한 가지만 적고, 성공 판정 숫자를 함께 쓰세요. 전체 300자 이내.";
    ask("cb"+si+bi,p5,{modelTier:"default"}).then(function(t){
      blk.coaching=t;
      var body={}; for(var k in ses) if(k!=="id") body[k]=ses[k];
      put("sessions",ses,true).then(render);
    }).catch(function(){});
    return;
  }

  /* --- 라운드 --- */
  if(a==="saveRound"){
    function g2(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
    var r2=S.sheet.data;
    r2.date=g2("rf_date")||today(); r2.type=g2("rf_type"); r2.course=g2("rf_course");
    r2.score=num(g2("rf_score")); r2.par=num(g2("rf_par")); r2.putts=num(g2("rf_putts"));
    r2.fw=num(g2("rf_fw")); r2.gir=num(g2("rf_gir")); r2.ob=num(g2("rf_ob"));
    r2.penalty=num(g2("rf_pen")); r2.dbl=num(g2("rf_dbl")); r2.parOrBetter=num(g2("rf_par_or_better"));
    readRoundForm(r2);                                  /* 홀별 표까지 담는다 */
    var rt=holeTally(r2);
    if(rt.n>=18){
      if(r2.score==null) r2.score=rt.sum;
      if(r2.par==null&&rt.par) r2.par=rt.par;
    }
    if(rt.marks){ if(r2.dbl==null) r2.dbl=rt.dbl; if(r2.parOrBetter==null) r2.parOrBetter=rt.good; }
    r2.note=g2("rf_note");
    put("rounds",r2).then(function(){
      S.sheet=null; S.sheetShown=null; render();
      var btn=document.querySelector('[data-act="analyzeRound"][data-id="'+r2.id+'"]');
      if(btn) btn.click();
    });
    return;
  }
  if(a==="delRound"){ del("rounds",el.getAttribute("data-id")); return; }
  if(a==="analyzeRound"){
    var rid=el.getAttribute("data-id");
    var rr=S.rounds.filter(function(x){return x.id===rid;})[0]; if(!rr) return;
    var drv2=S.clubs.filter(function(c){return c.cat==="driver"&&!c.spare;})[0];
    var lbd=drv2?lastBlockFor(drv2.id):null;
    var p6=profileText()+"\n\n라운드 기록\n"
      +"날짜 "+rr.date+" / "+(rr.type==="field"?"필드":"스크린")+(rr.course?(" / "+rr.course):"")+"\n"
      +"스코어 "+rr.score+" (파 "+rr.par+", "+(rr.score-rr.par>0?"+":"")+(rr.score-rr.par)+")\n"
      +[["퍼팅",rr.putts],["페어웨이 안착",rr.fw!=null?rr.fw+"/14":null],["그린 적중",rr.gir!=null?rr.gir+"/18":null],
        ["OB",rr.ob],["벌타",rr.penalty],["더블 이상",rr.dbl],["파 이상",rr.parOrBetter]]
        .filter(function(x){return x[1]!=null&&x[1]!=="";}).map(function(x){return x[0]+" "+x[1];}).join(" / ")
      +(function(){
         var tz=holeTally(rr);
         if(!tz.n) return "";
         var line=[]; for(var i=0;i<18;i++){ if(rr.holes[i]==null) continue;
           line.push((i+1)+"번 "+rr.holes[i]+(rr.pars&&rr.pars[i]!=null?("/파"+rr.pars[i]):"")); }
         return "\n홀별 타수: "+line.join(", ")
           +"\nOUT "+tz.out+" IN "+tz.inn+(tz.dbl?(" / 더블 이상 "+tz.dbl+"홀"):"");
       })()
      +(rr.note?("\n본인 메모: "+rr.note):"")
      +(lbd?("\n최근 드라이버 연습 10회 평균: "+metricSummary(lbd.m)):"")
      +"\n\n이 스코어에서 타수를 가장 많이 잃은 영역을 숫자로 짚어 주세요. "
      +"퍼팅·그린 적중·페어웨이·벌타 중 어디서 몇 타를 잃었는지 추정하고, 다음 연습에서 손댈 곳 한 군데만 지정하세요. "
      +"홀별 타수가 있으면 전반과 후반 중 어디서 무너졌는지, 무너진 홀이 몰려 있는지도 짚으세요. "
      +"장비 교체는 답에 넣지 마세요. 400자 이내, 머리말 없이 바로 시작.";
    ask("rd"+rid,p6,{modelTier:"default"}).then(function(t){
      rr.analysis=t; put("rounds",rr,true).then(render);
    }).catch(function(){});
    return;
  }
},false);

/* 잠금 화면에서 엔터·숫자 키도 받는다 */
document.addEventListener("keydown",function(ev){
  var L=S.lock; if(!L||!L.need||L.busy) return;
  if(ev.key==="Enter"){
    ev.preventDefault();
    var want = L.needUrl ? "saveUrl" : (L.mode==="signup" ? "doSignup" : "doLogin");
    var btn=document.querySelector('[data-act="'+want+'"]'); if(btn) btn.click();
  }
  return;
  if(!L.registered){
    if(ev.key==="Enter"){
      ev.preventDefault();
      var btn=document.querySelector('[data-act="doRegister"]'); if(btn) btn.click();
    }
    return;
  }

},false);

/* 입력값 보존 — 시트 안에서 입력 중 리렌더되면 값이 날아가지 않도록 */
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(!S.sheet) return;
  if(S.sheet.kind==="club" && t.id && t.id.indexOf("cf_")===0) readClubForm(S.sheet.data);
  if(S.sheet.kind==="block" && t.id && (t.id.indexOf("m_")===0||t.id==="bk_club")) readBlockForm(S.sheet.data);
},true);
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t && t.tagName==="SELECT" && t.getAttribute("data-act")==="setBlockClub"){
    pickBlockClub(+t.getAttribute("data-i"), t.value); return;
  }
  if(t && t.type==="file" && String(t.id||"").indexOf("multiPhoto")===0){
    var fl=t.files||[], vidPick=null;
    multiReset();
    for(var mi=0;mi<fl.length;mi++){
      /* 영상을 골랐으면 버리지 않고 영상 코치로 넘긴다 */
      if(fl[mi].type && /^video\//.test(fl[mi].type)){ if(!vidPick) vidPick=fl[mi]; continue; }
      if(fl[mi].type && !/^image\//.test(fl[mi].type)) continue;
      S.multi.files.push(fl[mi]);
      S.multi.names.push(fl[mi].name||("사진"+(mi+1)));
      S.multi.urls.push(makeUrl(fl[mi]));
      S.multi.marks.push("");
    }
    if(vidPick){
      S.multi.log=["영상은 세트로 만들지 않습니다. 아래 '스윙 영상'에서 자세를 봐 드립니다."];
      S.multi.bad=true;
      render(); lcVideo(-1,vidPick); return;
    }
    render(); return;
  }
  if(t && t.type==="file"){
    var bid=String(t.id||"").replace(/_(cam|file)$/,"");
    var f=t.files&&t.files[0];
    if(f && f.type && !/^image\//.test(f.type)){
      S.msg[bid==="clubPhoto"?"cphoto":"sphoto"]="사진 파일(JPG·PNG)만 됩니다.";
      render(); return;
    }
    if(f) takeFile(bid,f);
    else { S.picked=S.picked||{}; S.files=S.files||{};
           S.picked[bid]=null; S.files[bid]=null; paintPick(bid); }
    return;
  }
  if(t.id==="lk_remember"||t.id==="lk_auto"){
    setPref(t.id==="lk_remember"?"remember":"auto", !!t.checked);
    if(t.id==="lk_remember" && !t.checked) rememberName("");
    S.lock.focused=true; render(); return;
  }
  if(t.id==="dr_date" && S.draft){
    var dv=t.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)){ S.msg.date="날짜를 골라 주세요."; render(); return; }
    if(dv>today()){ S.msg.date="앞으로 올 날짜는 넣을 수 없습니다."; t.value=S.draft.date; render(); return; }
    S.draft.date=dv; S.msg.date=null; render(); return;
  }
  if(t.id==="bk_club" && S.sheet && S.sheet.kind==="block"){ readBlockForm(S.sheet.data); render(); }
},false);

/* 사진 칸에 끌어다 놓기 */
["dragenter","dragover"].forEach(function(n){
  document.addEventListener(n,function(ev){
    var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
    if(!z) return;
    ev.preventDefault(); ev.stopPropagation(); z.classList.add("drag");
  },false);
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
  if(z) z.classList.remove("drag");
},false);
document.addEventListener("drop",function(ev){
  var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
  if(!z) return;
  ev.preventDefault(); ev.stopPropagation(); z.classList.remove("drag");
  var id=z.getAttribute("data-pick");
  var dt=ev.dataTransfer, fs=(dt&&dt.files)||[];
  if(id.indexOf("multiPhoto")===0){
    multiReset();
    for(var di=0;di<fs.length;di++){
      if(fs[di].type && !/^image\//.test(fs[di].type)) continue;
      S.multi.files.push(fs[di]);
      S.multi.names.push(fs[di].name||("사진"+(di+1)));
      S.multi.urls.push(makeUrl(fs[di]));
      S.multi.marks.push("");
    }
    render(); return;
  }
  var f=fs[0];
  if(f && /^image\//.test(f.type)) takeFile(id,f);
  else { S.msg[id==="clubPhoto"?"cphoto":"sphoto"]="사진 파일만 됩니다."; render(); }
},false);

/* 붙여넣기 */
document.addEventListener("paste",function(ev){
  if(!S.sheet) return;
  var box=ev.target&&ev.target.closest&&ev.target.closest("[data-paste]");
  var id = box ? box.getAttribute("data-paste")
         : (S.sheet.kind==="club" ? "clubPhoto" : (S.sheet.kind==="block" ? "shotPhoto" : null));
  if(!id || !document.getElementById(id)) return;
  var items=(ev.clipboardData&&ev.clipboardData.items)||null;
  var files=(ev.clipboardData&&ev.clipboardData.files)||null;
  var got=null;
  if(files&&files.length&&/^image\//.test(files[0].type)) got=files[0];
  if(!got&&items) for(var i=0;i<items.length;i++){
    if(items[i].kind==="file"){
      var f2=items[i].getAsFile();
      if(f2 && /^image\//.test(f2.type)){ got=f2; break; }
    }
  }
  ev.preventDefault();
  if(box) box.textContent="";
  if(got) takeFile(id,got);
  else { S.msg[id==="clubPhoto"?"cphoto":"sphoto"]="붙여넣은 것에 사진이 없습니다. 사진을 먼저 복사해 주세요."; render(); }
},false);

/* 테마 토글 */
document.getElementById("themeBtn").addEventListener("click",function(){
  var root=document.documentElement, cur=root.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark?"light":"dark");
  try{ localStorage.setItem("swinglog.theme", dark?"light":"dark"); }catch(e){}
  drawSparks();
});
try{ var th=localStorage.getItem("swinglog.theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
window.addEventListener("resize",function(){ drawSparks(); });

/* ====================== 기동 ====================== */
/* 카메라로 바로 찍은 사진은 4~6MB에 4000px이 넘는다.
   그대로 보내면 올리는 데만 한참 걸려 시간이 다 간다.
   숫자를 읽는 데는 긴 변 1280px이면 충분하므로 보내기 전에 줄인다.
   큰 사진에서 한 가지 방법이 실패하는 일이 잦아 세 가지를 차례로 시도한다. */
var MAX_PX=1000, JPEG_Q=0.70, MAX_BYTES=450000;

function canvasToUrl(src,w,h,maxPx,q){
  var k=Math.min(1, maxPx/Math.max(w,h));
  var cw=Math.max(1,Math.round(w*k)), ch=Math.max(1,Math.round(h*k));
  var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  var cx=cv.getContext("2d");
  cx.fillStyle="#fff"; cx.fillRect(0,0,cw,ch);
  cx.drawImage(src,0,0,cw,ch);
  return {url:cv.toDataURL("image/jpeg",q), w:cw, h:ch};
}

/* 결과가 아직 크면 더 줄인다. 글자만 읽으면 되므로 과감해도 된다. */
function squeeze(src,w,h){
  var px=MAX_PX, q=JPEG_Q, out=null;
  for(var i=0;i<4;i++){
    try{ out=canvasToUrl(src,w,h,px,q); }catch(e){ return null; }
    if(out.url.length*0.75 <= MAX_BYTES) return out;
    px=Math.round(px*0.8); q=Math.max(0.5,q-0.08);
  }
  return out;
}

function toDataURLp(file){
  return new Promise(function(res,rej){
    var done=false;
    function ok(out,how){
      if(done) return; done=true;
      S.shrunk={from:file.size||0,to:Math.round(out.url.length*0.75),w:out.w,h:out.h,how:how};
      res(out.url);
    }
    function raw(){
      if(done) return; done=true;
      S.shrunk={from:file.size||0,to:file.size||0,w:0,h:0,how:"원본"};
      var r=new FileReader();
      r.onload=function(){ res(r.result); };
      r.onerror=function(){ rej({message:"사진을 읽지 못했습니다."}); };
      r.readAsDataURL(file);
    }

    /* 1) createImageBitmap — 큰 사진에 가장 강하고 회전도 바로잡는다 */
    if(window.createImageBitmap){
      var opt={};
      try{ opt={imageOrientation:"from-image"}; }catch(e){}
      var pr;
      try{ pr=createImageBitmap(file,opt); }catch(e){ pr=null; }
      if(pr && pr.then){
        pr.then(function(bm){
          var out=squeeze(bm,bm.width,bm.height);
          try{ bm.close&&bm.close(); }catch(e){}
          if(out) ok(out,"줄임"); else viaImage();
        }).catch(function(){ viaImage(); });
        return;
      }
    }
    viaImage();

    /* 2) Image + objectURL */
    function viaImage(){
      if(done) return;
      var url;
      try{ url=URL.createObjectURL(file); }catch(e){ raw(); return; }
      var img=new Image();
      var t=setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} raw(); },8000);
      img.onload=function(){
        clearTimeout(t);
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        try{URL.revokeObjectURL(url);}catch(e){}
        if(!w||!h){ raw(); return; }
        var out=squeeze(img,w,h);
        if(out) ok(out,"줄임"); else raw();
      };
      img.onerror=function(){ clearTimeout(t); try{URL.revokeObjectURL(url);}catch(e){} raw(); };
      img.src=url;
    }
  });
}

function sizeNote(){
  var k=S.shrunk;
  if(!k) return "";
  function mb(n){ return n>=1048576 ? (Math.round(n/104857.6)/10+"MB") : (Math.round(n/1024)+"KB"); }
  if(k.how==="원본") return " (줄이지 못해 원본 "+mb(k.from)+"을 보냈습니다)";
  return " ("+mb(k.from)+" → "+mb(k.to)+", "+k.w+"×"+k.h+")";
}

/* 서버가 끝내 답하지 않으면 영원히 돌지 않도록 끊는다. */
function withTimeout(pr,ms,msg){
  return new Promise(function(res,rej){
    var done=false;
    var t=setTimeout(function(){ if(!done){ done=true; rej({code:"timeout",message:msg}); } },ms);
    pr.then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } },
            function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
  });
}
/* 아래 sample 은 아티팩트판과 같은 모양을 유지하기 위한 껍데기다.
   실제 호출은 전부 앱스 스크립트 서버를 거쳐 제미나이로 간다. */
var sample = function(prompt,opts){
  return call("apiAsk",prompt).then(function(t){ return {text:t,truncated:false}; });
};
sample.json = function(prompt,opts){
  var f = opts && opts.images && opts.images[0];
  if(!f) return call("apiAsk",prompt).then(function(t){
    try{ return JSON.parse(t); }catch(e){ throw {code:"invalid_json",message:t}; }
  });
  return toDataURLp(f).then(function(u){
    var fn = /라운드/.test(prompt) ? "apiReadRound"
           : /클럽/.test(prompt) ? "apiReadClub" : "apiReadShot";
    return withTimeout(call(fn,u), 170000,
      "답이 오지 않았습니다"+sizeNote()+". 편집기에서 testPhotoSpeed 를 실행하면 "
      +"구글 쪽이 느린 것인지 알 수 있습니다. 급하면 아래 칸에 직접 넣어 주세요.");
  });
};
sample.limits = function(){ return Promise.resolve({images: ready.img?{maxCount:1}:undefined}); };

/* 자동 로그인이 켜져 있으면 브라우저를 닫아도 남는 곳에, 꺼져 있으면
   탭을 닫으면 사라지는 곳에 둔다. 비밀번호는 어느 쪽에도 저장하지 않는다. */
function pref(k,dflt){ try{ var v=localStorage.getItem("swinglog."+k); return v===null?dflt:v==="1"; }catch(e){ return dflt; } }
function setPref(k,on){ try{ localStorage.setItem("swinglog."+k, on?"1":"0"); }catch(e){} }

function getToken(){
  try{ var a=localStorage.getItem("swinglog.tk"); if(a) return a; }catch(e){}
  try{ var b=sessionStorage.getItem("swinglog.tk"); if(b) return b; }catch(e){}
  return "";
}
function saveToken(t){
  try{ localStorage.removeItem("swinglog.tk"); }catch(e){}
  try{ sessionStorage.removeItem("swinglog.tk"); }catch(e){}
  if(!t) return;
  if(pref("auto",true)){ try{ localStorage.setItem("swinglog.tk",t); }catch(e){} }
  else { try{ sessionStorage.setItem("swinglog.tk",t); }catch(e){} }
}
function savedName(){ try{ return localStorage.getItem("swinglog.name")||""; }catch(e){ return ""; } }
function rememberName(n){
  try{
    if(pref("remember",true) && n) localStorage.setItem("swinglog.name",n);
    else localStorage.removeItem("swinglog.name");
  }catch(e){}
}

function tickWait(){
  if(S.lock.wait<=0) return;
  setTimeout(function(){
    S.lock.wait--; if(S.lock.wait<=0){ S.lock.err=null; }
    if(S.lock.need) render();
    tickWait();
  },1000);
}

/* 화면을 그리기 전에 잠금 상태부터 묻는다. */
/* 사진을 찍고 돌아오면 앱이 처음부터 다시 열린다.
   그때마다 "여는 중"을 보여 주면 연습이 끊긴다.
   기기에 사본이나 하던 기록이 있으면 묻기 전에 바로 띄우고, 확인은 뒤에서 한다. */
function openEarly(){
  if(!apiUrl()) return false;
  var had = getCache() ? showCached() : false;
  if(!had && !S.draft) return false;
  S.lock.need=false; S.lock.checking=false; S.loaded=true; S.earlyShown=true;
  return true;
}

function gate(){
  if(!S.lock.id && pref("remember",true)) S.lock.id=savedName();
  if(!apiUrl()){ S.lock.need=true; S.lock.needUrl=true; S.lock.checking=false; render(); return Promise.resolve(); }

  /* 이 기기에 사본이 있으면 묻는 동안 기다리게 하지 않는다.
     서버가 "잠겼다"고 답하면 그때 사본을 지우고 잠금 화면으로 돌린다. */
  var early=S.earlyShown;
  if(!early && getCache()){
    early=showCached();
    if(early){ S.lock.need=false; S.lock.checking=false; render(); }
  }

  return call("apiAuthState",getToken()).then(function(st){
    S.lock.checking=false;
    S.openMode=!!st.open;
    S.lock.name=st.name||"";
    S.lock.id=st.loginId||S.lock.id||"";
    S.lock.need=!st.unlocked;
    if(S.lock.need && early){
      /* 서버가 잠겼다고 한다. 미리 띄운 사본을 거둔다. */
      dropCache(); S.loaded=false; S.fromCache=false;
      S.clubs=[]; S.sessions=[]; S.rounds=[];
    }
    render();
    if(!S.lock.need) boot();
  }).catch(function(e){
    S.lock.checking=false;
    if(early){
      /* 사본으로 이미 들어와 있다. 서버만 못 닿은 것이므로 내쫓지 않는다. */
      S.conn.err="서버에 닿지 못했습니다. 이 기기에 있던 사본을 보고 있습니다.";
      render();
      return;
    }
    S.lock.need=true; S.lock.err=(e&&e.message)||"서버에 연결하지 못했습니다.";
    render();
  });
}

function boot(){
  S.conn.tried=true;
  checkVersion(true).then(function(){ if(S.verNew) render(); });
  var had=showCached();
  if(had) render();              /* 기다리지 않고 바로 보여준다 */
  /* 잠금을 푼 뒤부터 센다. 페이지가 열린 시각부터 재면 잠금 화면에 머문 시간까지 포함돼
     한 번 지나가 버리고, 그 뒤로는 영영 아무 말도 하지 않게 된다. */
  if(S.loadTimer) clearTimeout(S.loadTimer);
  S.loadTimer=setTimeout(function(){
    if(S.loaded) return;
    S.conn.tried=true;
    if(!S.conn.err) S.conn.err="시트가 20초 동안 답하지 않았습니다. 다시 연결을 눌러 주세요.";
    S.loaded=true; render();
  },20000);
  return loadAll(had);
}
function reconnect(){
  S.conn.retrying=true; S.conn.err=null; render();
  boot().then(function(){ S.conn.retrying=false; render(); })
        .catch(function(){ S.conn.retrying=false; render(); });
}
restoreTab();     /* 보던 탭으로 돌아온다 */
restoreDraft();   /* 하던 기록이 있으면 그보다 먼저 그 자리로 */
openEarly();      /* 사본이나 하던 기록이 있으면 묻기 전에 먼저 띄운다 */
render();
gate();
})();
</script>
