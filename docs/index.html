<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>스윙 로그</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 폰 우선 단일 컬럼 + 하단 탭바. 측정 숫자는 모노 탭뉴머럴, 제목은 고딕A1 */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface2:#EFEDE7; --line:#DEDAD1;
  --fg:#1C1A17; --fg2:#6B655C; --fg3:#9A938A;
  --accent:#BF4F19; --accentSoft:#F7E3D8;
  --ok:#1C7A58; --okSoft:#DAEFE6;
  --warn:#9C6600; --warnSoft:#F6E9C9;
  --bad:#AC241D; --badSoft:#F7DDDB;
  --shadow:0 1px 2px rgba(28,26,23,.05),0 10px 26px rgba(28,26,23,.05);
  --fDisp:'Gothic A1','Noto Sans KR',system-ui,sans-serif;
  --fBody:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --fData:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1D1B18; --surface2:#262320; --line:#35312C;
  --fg:#F2EFE9; --fg2:#A8A199; --fg3:#776F67;
  --accent:#FF8B4F; --accentSoft:#3B2317;
  --ok:#53C195; --okSoft:#143027;
  --warn:#E0A63A; --warnSoft:#352911;
  --bad:#F08078; --badSoft:#3B1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1D1B18; --surface2:#262320; --line:#35312C;
  --fg:#F2EFE9; --fg2:#A8A199; --fg3:#776F67;
  --accent:#FF8B4F; --accentSoft:#3B2317;
  --ok:#53C195; --okSoft:#143027;
  --warn:#E0A63A; --warnSoft:#352911;
  --bad:#F08078; --badSoft:#3B1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fBody);line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fDisp);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- 뼈대 ---- */
#app{max-width:720px;margin:0 auto;padding:0 16px 104px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:0;border-radius:9px;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95) 0 3px,transparent 3.5px),
             linear-gradient(transparent 0 62%,rgba(255,255,255,.55) 62% 64%,transparent 64%)}
.brand{font-family:var(--fDisp);font-weight:800;font-size:17px;letter-spacing:-.03em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--fBody);font-weight:400;font-size:11px;color:var(--fg3);letter-spacing:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
nav.tabs button{background:none;border:0;padding:7px 2px 6px;border-radius:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg3);font-size:10.5px;font-weight:500}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}

/* ---- 공통 부품 ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.eyebrow{font-family:var(--fDisp);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.muted{color:var(--fg2);font-size:13px}
.tiny{color:var(--fg3);font-size:12px}
.sec-title{font-size:19px;margin-bottom:2px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;
  font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2);padding:7px 9px}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--fg2);min-width:0}
/* 제목 자리에 놓이는 날짜 — 눌러서 바로 고친다 */
input.dateTitle{width:auto;min-width:0;max-width:100%;flex:0 1 auto;white-space:nowrap;
  background:transparent;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;
  padding:0 2px 2px;font-family:var(--fDisp);font-size:20px;font-weight:700;letter-spacing:-.01em;
  color:var(--fg);cursor:pointer;-webkit-appearance:none;appearance:none}
input.dateTitle:focus{outline:none;border-bottom-color:var(--accent)}
input.dateTitle::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;width:100%;font-family:var(--fBody)}
input.num,input.lr{font-family:var(--fData);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;
  font-family:var(--fDisp);letter-spacing:.01em;width:auto;max-width:max-content;flex:none;vertical-align:1px}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.neutral{background:var(--surface2);color:var(--fg2)}
.chip.acc{background:var(--accentSoft);color:var(--accent)}

.grade{font-family:var(--fDisp);font-weight:800;font-size:13px;width:28px;height:28px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.grade.A{background:var(--okSoft);color:var(--ok)}
.grade.B{background:var(--accentSoft);color:var(--accent)}
.grade.C{background:var(--warnSoft);color:var(--warn)}
.grade.D{background:var(--badSoft);color:var(--bad)}
.grade.X{background:var(--surface2);color:var(--fg3)}

/* 측정 타일 */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:470px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
.metric{background:var(--surface);padding:9px 8px 10px;min-width:0}
.metric b{display:block;font-family:var(--fData);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{display:block;font-size:10.5px;color:var(--fg3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric.good b{color:var(--ok)}
.metric.off b{color:var(--bad)}
.metric .d{font-size:10.5px;font-family:var(--fData);font-weight:600}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)} .d.flat{color:var(--fg3)}

/* 체크리스트 */
.check{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;width:21px;height:21px;border:2px solid var(--line);border-radius:7px;flex:none;margin-top:2px;cursor:pointer;position:relative;background:var(--bg)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.check .ct{min-width:0;flex:1}
.check .ct b{display:block;font-size:14.5px;font-weight:600}
.check .ct span{display:block;font-size:12.5px;color:var(--fg2)}
.check input:checked + .ct b{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--fg3)}

/* 진행 단계 */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.done{background:var(--ok)}

.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.listrow:last-child{border-bottom:0}
.listrow .bd{flex:1;min-width:0}
.listrow .bd b{display:block;font-size:15px;font-weight:700;font-family:var(--fDisp);letter-spacing:-.01em}
.listrow .bd span{display:block;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow .rt{text-align:right;flex:none;font-family:var(--fData);font-variant-numeric:tabular-nums}
.listrow .rt b{font-size:15px;font-weight:600;display:block}
.listrow .rt span{font-size:11px;color:var(--fg3)}

.ai{background:var(--accentSoft);border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.72;white-space:pre-wrap}
.ai .hd{font-family:var(--fDisp);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.note{background:var(--surface2);border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.banner{border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.6;background:var(--surface2);color:var(--fg2)}
.banner.warn{background:var(--warnSoft);color:var(--warn)}
.banner.bad{background:var(--badSoft);color:var(--bad)}
.banner.ok{background:var(--okSoft);color:var(--ok)}

.empty{text-align:center;padding:30px 16px;color:var(--fg2)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--fg)}
.empty p{font-size:13.5px}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .hdl{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}

table.gap{width:100%;border-collapse:collapse;font-family:var(--fData);font-variant-numeric:tabular-nums;font-size:13px}
table.gap th{font-family:var(--fBody);font-size:11px;color:var(--fg3);text-align:right;font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
table.gap th:first-child,table.gap td:first-child{text-align:left;font-family:var(--fBody);font-weight:600}
table.gap td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.gap tr:last-child td{border-bottom:0}
td.flagbad{color:var(--bad);font-weight:600}
td.flagok{color:var(--ok)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.spark{display:block;width:100%;height:76px}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
.filebtn{position:relative;display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;
  padding:16px 14px;cursor:pointer;background:var(--bg);width:100%;min-height:62px;transition:.12s;
  -webkit-tap-highlight-color:transparent}
.filebtn:hover,.filebtn:focus,.filebtn.drag{border-color:var(--accent);background:var(--accentSoft);outline:none}
.filebtn.on{border-style:solid;border-color:var(--accent)}
.filebtn input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;
  font-size:0;border:0;padding:0;margin:0}
.filebtn .fb-ic{width:34px;height:34px;border-radius:10px;background:var(--accentSoft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none;line-height:1}
.filebtn .fb-tx{min-width:0;flex:1}
.filebtn .fb-tx b{display:block;font-size:14.5px;font-weight:600}
.filebtn .fb-tx span{display:block;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastebox{margin-top:8px;min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:13px 12px;
  font-size:13.5px;color:var(--fg2);background:var(--surface2);-webkit-user-select:text;user-select:text;
  overflow:hidden;white-space:nowrap}
.pastebox:empty:before{content:attr(data-ph);color:var(--fg3)}
.pastebox:focus{outline:none;border-color:var(--accent);background:var(--accentSoft)}
body.locked > :not(#lockHost){display:none !important}
.lockWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;background:var(--bg);overflow-y:auto;z-index:50}
.lockCard{width:100%;max-width:340px;text-align:center}
.lockMark{font-size:40px;line-height:1;margin-bottom:14px}
.lockCard h2{font-size:23px;font-weight:700;letter-spacing:-.01em}
.lockCard .f{text-align:left}
.optrow{display:flex;gap:16px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg2);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.opt input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.photoPrev{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface2)}
.holes{display:grid;grid-template-columns:34px repeat(9,minmax(0,1fr));gap:3px;align-items:center}
.holes>span{font-size:11px;color:var(--fg3);text-align:center;font-family:var(--fBody)}
.holes>span.rl{text-align:left;color:var(--fg2);font-weight:600}
.holes input{padding:6px 0;text-align:center;font-size:14px;border-radius:7px;min-width:0}
.holes .par{font-size:12px;color:var(--fg3);text-align:center}
.holeSum{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--fg3);font-family:var(--fBody)}
.holeSum b{color:var(--fg);font-size:13px}
.hRow{font-size:11px;letter-spacing:.3px;display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.hRow i{font-style:normal;min-width:26px;text-align:center;padding:3px 2px;border-radius:6px;
  background:var(--surface2);color:var(--fg2);font-family:var(--fBody)}
.hRow i.bird{background:#DCEBD8;color:#2E5E22}
.hRow i.bogey{background:#F4E6D2;color:#8A5A14}
.hRow i.dbl{background:#F6D9D2;color:#9A3412}
ul.plain{list-style:none;padding:0;margin:6px 0 0}
ul.plain li{font-size:13px;line-height:1.65;padding-left:14px;position:relative;color:var(--fg2)}
ul.plain li:before{content:"·";position:absolute;left:3px}
ul.plain li.ok{color:var(--ok)}
ul.plain li.bad{color:var(--bad)}
.shots{display:flex;gap:9px;overflow-x:auto;margin-top:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.shot{flex:none;width:92px;margin:0}
.shot img{width:92px;height:70px;object-fit:cover;border-radius:9px;background:var(--surface2);
  border:1.5px solid var(--line);display:block}
.shot figcaption{font-size:10.5px;line-height:1.35;color:var(--fg3);margin-top:4px;text-align:center;
  word-break:keep-all}
.shot.now img{border-color:var(--accent)}
.shot.now figcaption{color:var(--accent);font-weight:600}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>

<div id="app">
  <div class="topbar">
    <div class="mark"></div>
    <div class="brand">스윙 로그<small id="sub">불러오는 중</small></div>
    <a class="btn ghost sm" id="sheetLink" href="#" target="_blank" rel="noopener" title="구글 시트 열기" hidden>시트</a>
    <button class="btn ghost sm" id="themeBtn" title="화면 밝기 전환" aria-label="화면 밝기 전환">◐</button>
    <button class="btn ghost sm" id="logoutBtn" data-act="lockNow" title="로그아웃" aria-label="로그아웃">나가기</button>
  </div>
  <main id="main"><div class="empty"><h3>준비 중</h3><p>클럽과 기록을 불러오고 있습니다.</p></div></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="sheetHost"></div>

<script>
(function(){
"use strict";

/* ====================== 상수 ====================== */
var CAT = {driver:"드라이버",wood:"우드",hybrid:"하이브리드",iron:"아이언",wedge:"웨지",putter:"퍼터"};

/* 사용자의 실측·목표 기준. 측정 10회 평균과 비교하는 잣대 */
var TARGET = {
  driver:{carry:[172,190],launch:[13.5,16.5],back:[2100,2900],width:[0,16],depth:[0,13],dir:3.0,label:"드라이버"},
  hybrid:{carry:[132,146],launch:[13,17],back:[3000,4200],width:[0,15],depth:[0,13],dir:3.0,label:"하이브리드"},
  i4:{carry:[126,136],launch:[16,19],back:[4200,5200],width:[0,14],depth:[0,11],dir:3.0,label:"4번"},
  i5:{carry:[116,124],launch:[17,20],back:[4700,5700],width:[0,14],depth:[0,11],dir:3.0,label:"5번"},
  i6:{carry:[107,115],launch:[18,21],back:[5100,6200],width:[0,13],depth:[0,10],dir:3.0,label:"6번"},
  i7:{carry:[98,108],launch:[19,22],back:[5700,6900],width:[0,13],depth:[0,10],dir:3.0,label:"7번"},
  i8:{carry:[88,98],launch:[21,24],back:[6300,7600],width:[0,12],depth:[0,9],dir:3.0,label:"8번"},
  i9:{carry:[79,89],launch:[23,26],back:[7000,8300],width:[0,12],depth:[0,9],dir:3.0,label:"9번"},
  pw:{carry:[70,80],launch:[25,28],back:[7800,9000],width:[0,11],depth:[0,8],dir:2.5,label:"피칭"},
  w48:{carry:[60,70],launch:[27,31],back:[8200,9500],width:[0,10],depth:[0,8],dir:2.5,label:"48도"},
  w52:{carry:[50,60],launch:[29,33],back:[8500,10000],width:[0,9],depth:[0,7],dir:2.5,label:"52도"},
  w56:{carry:[40,50],launch:[31,36],back:[9000,11000],width:[0,9],depth:[0,7],dir:2.5,label:"56도"}
};

function uuid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){ if(!s) return ""; var p=String(s).split("-"); return p.length<3?s:(+p[1])+"월 "+(+p[2])+"일"; }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function lrToNum(v){ if(v==null||v==="") return null; var s=String(v).trim().toUpperCase();
  var neg=/^L/.test(s)||/L$/.test(s), pos=/^R/.test(s)||/R$/.test(s);
  var n=parseFloat(s.replace(/[LR\s]/g,"")); if(!isFinite(n)) return null;
  if(neg) return -Math.abs(n); if(pos) return Math.abs(n); return n; }
function numToLR(n,dp){ if(n==null||!isFinite(n)) return "—"; var a=Math.abs(n).toFixed(dp==null?1:dp);
  if(Math.abs(n)<0.05) return a; return (n<0?"L":"R")+a; }
function r1(n){ return n==null?"—":(Math.round(n*10)/10); }

/* 깃허브 페이지에서 앱스 스크립트 서버로 보낸다.
   Content-Type 을 text/plain 으로 두면 브라우저가 미리 묻는 절차(preflight)를 건너뛴다.
   앱스 스크립트는 그 절차에 답할 수 없어서, 이렇게 해야 통한다. */
function apiUrl(){
  try{
    var u=localStorage.getItem("swinglog.api");
    if(u) return u;
  }catch(e){}
  return (window.SWINGLOG_API||"");
}
function saveApiUrl(u){ try{ localStorage.setItem("swinglog.api",u); }catch(e){} }

function call(name){
  var args=[].slice.call(arguments,1);
  var url=apiUrl();
  if(!url) return Promise.reject({message:"서버 주소가 아직 없습니다.",needUrl:true});
  return fetch(url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({fn:name,args:args,token:getToken()})
  }).then(function(r){
    if(!r.ok) throw {message:"서버가 "+r.status+" 로 답했습니다."};
    return r.text();
  }).then(function(t){
    var j;
    try{ j=JSON.parse(t); }
    catch(e){ throw {message:"서버 답을 읽지 못했습니다. 배포 주소가 /exec 로 끝나는지, 접근 권한이 '모든 사용자'인지 확인하세요."}; }
    if(j.ok) return j.value;
    if(j.locked){
      saveToken("");
      S.lock.need=true; S.lock.err="다시 들어와 주세요."; S.lock.focused=false; render();
    }
    throw {message:j.error||"요청이 처리되지 않았습니다."};
  });
}
function errMsg(e){
  if(!e) return "알 수 없는 오류입니다.";
  var m=String(e.message||e);
  if(/Authoriz|권한/i.test(m)) return "권한이 없습니다. 웹앱 주소를 다시 열어 접근을 허용해 주세요.";
  if(/exceeded|quota|한도/i.test(m)) return "구글 사용 한도에 걸렸습니다. 잠시 뒤 다시 시도하세요.";
  return m.slice(0,200);
}
function applyCfg(cfg){
  if(!cfg) return;
  Object.keys(cfg).forEach(function(k){
    var c=cfg[k]; if(!c) return;
    var t=TARGET[k]||{};
    function pair(a){ return (a&&a[0]!=null&&a[1]!=null)?[a[0],a[1]]:null; }
    if(pair(c.carry))  t.carry=pair(c.carry);
    if(pair(c.launch)) t.launch=pair(c.launch);
    if(pair(c.back))   t.back=pair(c.back);
    if(c.width&&c.width[1]!=null) t.width=[0,c.width[1]];
    if(c.depth&&c.depth[1]!=null) t.depth=[0,c.depth[1]];
    if(c.dir!=null) t.dir=c.dir;
    if(c.label) t.label=c.label;
    TARGET[k]=t;
  });
}
/* 기록은 구글 시트가 원본이다. 다만 열 때마다 서버를 깨우고 시트를 다 읽느라
   몇 초를 기다리게 된다. 그래서 마지막으로 받은 내용을 이 기기에 한 벌 베껴 두고,
   열자마자 그것부터 보여준 뒤 뒤에서 조용히 새로 받아 맞춘다.
   베껴 둔 것은 어디까지나 사본이고, 기준은 늘 시트다. */
var CACHE_KEY="swinglog.cache";

function putCache(d){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), d:d})); }catch(e){}
}
function getCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    return (o&&o.d)?o:null;
  }catch(e){ return null; }
}
function dropCache(){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} }

/** 화면에 있는 내용을 이 기기 사본에 그대로 반영한다 */
function syncCache(){
  putCache({clubs:S.clubs, sessions:S.sessions, rounds:S.rounds,
            cfg:S.cfgRaw||null, hasAI:ready.ai, sheetUrl:S.sheetUrl});
}

function applyPayload(d){
  function byDate(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); }
  S.clubs=(d.clubs||[]).sort(function(a,b){ return (a.order||0)-(b.order||0); });
  S.sessions=(d.sessions||[]).sort(byDate);
  S.rounds=(d.rounds||[]).sort(byDate);
  applyCfg(d.cfg);
  S.cfgRaw=d.cfg||null;
  ready.ai=!!d.hasAI; ready.img=!!d.hasAI;
  S.sheetUrl=d.sheetUrl||"";
}

/** 베껴 둔 사본으로 화면을 먼저 채운다. 있으면 true. */
function showCached(){
  var c=getCache();
  if(!c) return false;
  applyPayload(c.d);
  S.conn.db=true; S.conn.user=true; S.conn.uid="sheet"; S.conn.err=null;
  S.loaded=true; S.fromCache=true; S.cacheAt=c.at;
  return true;
}

function loadAll(quiet){
  if(quiet) S.syncing=true;
  return call("apiLoad").then(function(d){
    applyPayload(d);
    putCache(d);
    S.conn.db=true; S.conn.user=true; S.conn.uid="sheet"; S.conn.err=null;
    S.loaded=true; S.fromCache=false; S.syncing=false;
    if(S.loadTimer) clearTimeout(S.loadTimer); setTimeout(render,0);
  }).catch(function(e){
    S.syncing=false;
    if(S.fromCache){            /* 사본이 떠 있으면 화면을 비우지 않는다 */
      S.conn.err=null; S.loaded=true; render(); return;
    }
    S.conn.tried=true; S.conn.err=errMsg(e); S.loaded=true;
    if(S.loadTimer) clearTimeout(S.loadTimer); render();
  });
}
function put(name,obj,quiet){
  if(!obj.id) obj.id=uuid();
  var fn = name==="clubs" ? "apiSaveClub" : name==="sessions" ? "apiSaveSession" : "apiSaveRound";
  return call(fn,obj).then(function(id){
    if(id) obj.id=id;
    var arr=S[name],hit=false;
    for(var i=0;i<arr.length;i++) if(arr[i].id===obj.id){ arr[i]=obj; hit=true; break; }
    if(!hit) arr.unshift(obj);
    if(name==="clubs") arr.sort(function(a,b){return (a.order||0)-(b.order||0);});
    else arr.sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
    syncCache();
    if(!quiet) render();
  }).catch(function(e){ flash("시트에 저장하지 못했습니다. "+errMsg(e)); });
}
function del(name,id){
  var fn = name==="clubs" ? "apiDeleteClub" : name==="sessions" ? "apiDeleteSession" : "apiDeleteRound";
  return call(fn,id).then(function(){
    S[name]=S[name].filter(function(x){return x.id!==id;}); syncCache(); render();
  }).catch(function(e){ flash("삭제하지 못했습니다. "+errMsg(e)); });
}
function flash(t){ S.msg.flash=t; render(); setTimeout(function(){ if(S.msg.flash===t){ S.msg.flash=null; render(); } },4200); }

/* ====================== 평가 로직 ====================== */
function tkey(c){
  if(!c) return null;
  if(c.tkey && TARGET[c.tkey]) return c.tkey;
  if(c.cat==="driver") return "driver";
  if(c.cat==="hybrid"||c.cat==="wood") return "hybrid";
  if(c.cat==="iron"){ var m=String(c.name||"").match(/(\d)/); if(m){ var k="i"+m[1]; if(TARGET[k]) return k; }
    if(/P|피칭/i.test(c.name||"")) return "pw"; }
  if(c.cat==="wedge"){ var l=num(c.loft); if(l){ if(l<=49) return "w48"; if(l<=54) return "w52"; return "w56"; } }
  return null;
}
function inRange(v,r){ return v!=null && r && v>=r[0] && v<=r[1]; }

/* 10회 평균 1세트를 기준 및 직전 기록과 대조 */
function evalBlock(club,m,prev){
  var T = TARGET[tkey(club)] || null;
  var good=[],bad=[],deltas={};
  if(prev) METRICS.forEach(function(x){
    if(m[x.k]!=null && prev[x.k]!=null) deltas[x.k]=Math.round((m[x.k]-prev[x.k])*10)/10;
  });
  if(T){
    [["carry","캐리","m"],["launch","발사각","°"],["back","백스핀","rpm"]].forEach(function(p){
      var v=m[p[0]], r=T[p[0]]; if(v==null||!r) return;
      if(inRange(v,r)) good.push(p[1]+" "+r1(v)+p[2]+" (기준 "+r[0]+"~"+r[1]+")");
      else bad.push(p[1]+" "+r1(v)+p[2]+" — 기준 "+r[0]+"~"+r[1]+"에서 "+(v<r[0]?"낮음":"높음"));
    });
    [["width","좌우 편차","m"],["depth","앞뒤 편차","m"]].forEach(function(p){
      var v=m[p[0]], r=T[p[0]]; if(v==null||!r) return;
      if(v<=r[1]) good.push(p[1]+" "+r1(v)+p[2]+" (기준 "+r[1]+" 이하)");
      else bad.push(p[1]+" "+r1(v)+p[2]+" — 기준 "+r[1]+p[2]+"보다 "+r1(v-r[1])+p[2]+" 넓음");
    });
    if(m.dir!=null){
      if(Math.abs(m.dir)<=T.dir) good.push("방향각 "+numToLR(m.dir)+"° (기준 ±"+T.dir+"° 이내)");
      else bad.push("방향각 "+numToLR(m.dir)+"° — "+(m.dir<0?"왼":"오른")+"쪽으로 출발. 셋업 정렬 점검");
    }
  }
  if(m.side!=null && Math.abs(m.side)>600) bad.push("사이드스핀 "+numToLR(m.side,0)+"rpm — 좌우 회전이 큼");
  return {good:good,bad:bad,deltas:deltas,hasT:!!T};
}
function metricState(club,k,v){
  var T=TARGET[tkey(club)]; if(!T||v==null) return "";
  if(k==="carry"||k==="launch"||k==="back") return T[k] ? (inRange(v,T[k])?"good":"off") : "";
  if(k==="width"||k==="depth") return T[k] ? (v<=T[k][1]?"good":"off") : "";
  if(k==="dir") return Math.abs(v)<=T.dir ? "good":"off";
  return "";
}
function lastBlockFor(clubId,beforeSessionId){
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i]; if(beforeSessionId && s.id===beforeSessionId) continue;
    var bs=s.blocks||[];
    for(var j=bs.length-1;j>=0;j--) if(bs[j].clubId===clubId && bs[j].m) return {m:bs[j].m,date:s.date};
  }
  return null;
}
function clubBest(clubId){
  var best=null;
  S.sessions.forEach(function(s){ (s.blocks||[]).forEach(function(b){
    if(b.clubId===clubId && b.m && b.m.carry!=null && (!best||b.m.carry>best.carry)) best={carry:b.m.carry,date:s.date};
  });});
  return best;
}
function clubSeries(clubId,k){
  var out=[];
  S.sessions.slice().reverse().forEach(function(s){ (s.blocks||[]).forEach(function(b){
    if(b.clubId===clubId && b.m && b.m[k]!=null) out.push({v:b.m[k],date:s.date});
  });});
  return out;
}

/* 가방 전체 — 로프트/거리 간격 */
function bagGaps(){
  var rows=S.clubs.filter(function(c){ return c.cat!=="putter"; }).map(function(c){
    var b=clubBest(c.id), t=TARGET[tkey(c)];
    return {c:c,loft:num(c.loft),carry:b?b.carry:(t?Math.round((t.carry[0]+t.carry[1])/2):null),measured:!!b};
  }).filter(function(r){ return r.carry!=null; }).sort(function(a,b){ return b.carry-a.carry; });
  for(var i=0;i<rows.length;i++){
    rows[i].dCarry = i===0?null:Math.round((rows[i-1].carry-rows[i].carry)*10)/10;
    rows[i].dLoft = (i===0||rows[i].loft==null||rows[i-1].loft==null)?null:Math.round((rows[i].loft-rows[i-1].loft)*10)/10;
  }
  return rows;
}

/* ====================== AI ====================== */
function ask(key,prompt,opts){
  if(!sample){ S.msg[key]="AI 코칭을 쓸 수 없는 화면입니다."; render(); return Promise.reject(); }
  S.busy[key]=true; S.msg[key]=null; render();
  return sample(prompt,opts||{}).then(function(r){ S.busy[key]=false; render(); return r.text; })
    .catch(function(e){ S.busy[key]=false;
      var c=e&&e.code;
      S.msg[key]= c==="not_granted"||c==="sampling_disabled" ? "AI 사용이 허용되지 않았습니다."
        : c==="rate_limited" ? "요청이 몰렸습니다. 잠시 뒤 다시 눌러 주세요."
        : c==="refused" ? "이 내용은 분석하지 못했습니다. 입력을 조금 바꿔 보세요."
        : "분석에 실패했습니다. 다시 눌러 주세요.";
      render(); throw e; });
}
function askJson(key,prompt,opts){
  if(!sample){ S.msg[key]="AI를 쓸 수 없는 화면입니다."; render(); return Promise.reject(); }
  S.busy[key]=true; S.msg[key]=null; render();
  return sample.json(prompt,opts||{}).then(function(v){ S.busy[key]=false; render(); return v; })
    .catch(function(e){ S.busy[key]=false;
      S.msg[key]= (e&&e.code==="invalid_json") ? "사진에서 숫자를 읽지 못했습니다. 화면이 잘 보이게 다시 찍거나 직접 입력하세요."
        : (e&&e.code==="not_granted") ? "AI 사용이 허용되지 않았습니다." : "읽어내지 못했습니다. 직접 입력해 주세요.";
      render(); throw e; });
}

/* 다시 그릴 때는 화면을 통째로 갈아끼우므로 스크롤이 맨 위로 돌아간다.
   보고 있던 자리를 기억했다가 그린 뒤 되돌린다. 일부러 위로 올릴 때는 S.jump 를 세운다. */
function render(){
  if(S.lock && S.lock.need){ renderLock(); return; }
  var lw=document.getElementById("lockHost"); if(lw) lw.innerHTML="";
  document.body.classList.remove("locked");
  renderTabs();
  var sub=document.getElementById("sub");
  sub.textContent = !S.loaded ? "불러오는 중"
    : !connOK() ? "구글 시트에 연결되지 않음"
    : (S.clubs.length+"개 클럽 · 연습 "+S.sessions.length+"회 · 라운드 "+S.rounds.length+"회"
       + (S.syncing ? " · 맞추는 중" : ""));
  var h = "";
  if(S.msg.flash) h += '<div class="banner warn" style="margin-bottom:14px">'+esc(S.msg.flash)+'</div>';
  h += connCard();
  h += ({home:viewHome,clubs:viewClubs,practice:viewPractice,rounds:viewRounds,growth:viewGrowth}[S.tab]||viewHome)();
  var inner=document.querySelector(".sheet .inner");
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  var iy=inner?inner.scrollTop:0;
  var hadSheet=!!inner;

  document.getElementById("main").innerHTML = h;
  var sl=document.getElementById("sheetLink");
  if(sl){ if(S.sheetUrl){ sl.href=S.sheetUrl; sl.hidden=false; } else sl.hidden=true; }
  var lb=document.getElementById("logoutBtn");
  if(lb) lb.hidden=!!S.openMode;
  document.getElementById("sheetHost").innerHTML = S.sheet ? sheetHTML() : "";

  /* 열려 있던 시트는 보던 자리 그대로 둔다 */
  if(hadSheet && S.sheet && iy){
    var again=document.querySelector(".sheet .inner");
    if(again) again.scrollTop=iy;
  }
  if(!S.jump && sy && (window.pageYOffset||0)!==sy) window.scrollTo(0,sy);
  S.jump=false;

  drawSparks();
}

  h+='<p class="tiny" style="margin-bottom:10px">시트에 저장된 기록이 지워진 것은 아닙니다. 연결되면 그대로 나타납니다.</p>';

      var list=S.clubs.filter(function(c){return c.cat===cat;});
      if(!list.length) return;
      h+='<div class="card"><div class="eyebrow">'+CAT[cat]+'</div><div style="margin-top:4px">';
      list.forEach(function(c){
        var b=clubBest(c.id), t=TARGET[tkey(c)];
        var issue=(c.issues&&c.issues.length)?c.issues.length:0;
        h+='<div class="listrow" data-act="openClub" data-id="'+esc(c.id)+'">';
        h+= c.photo ? '<img class="thumb" src="'+esc(c.photo)+'" alt="">' : '<span class="grade X">'+esc((c.name||"?").slice(0,2))+'</span>';
        h+='<div class="bd"><b>'+esc(c.name)+(c.spare?' <span class="chip neutral">예비</span>':'')+'</b>'
          +'<span>'+esc([c.brand,c.model,(c.loft?c.loft+"°":""),c.flex].filter(Boolean).join(" · "))+'</span></div>';
        h+='<div class="rt"><b>'+(b?r1(b.carry):(t?("~"+Math.round((t.carry[0]+t.carry[1])/2)):"—"))+'</b><span>'+(b?"실측 m":"기준 m")+'</span></div>';
        h+='</div>';
        if(issue) h+='<div style="padding:0 0 10px 58px;margin-top:-6px"><span class="chip warn">점검 '+issue+'건</span></div>';
      });
      h+='</div></div>';
    });

    /* 가방 간격 */
    var g=bagGaps();
    if(g.length>1){
      h+='<div class="card"><div class="eyebrow">가방 간격</div>';
      h+='<p class="muted" style="margin:6px 0 10px">거리 간격이 8m보다 좁으면 둘 중 하나는 역할이 겹칩니다. 로프트 간격은 3~4도가 적정입니다.</p>';
      h+='<div class="scroll-x"><table class="gap"><thead><tr><th>클럽</th><th>로프트</th><th>캐리</th><th>거리차</th><th>로프트차</th></tr></thead><tbody>';
      g.forEach(function(r){
        var badC = r.dCarry!=null && r.dCarry<8;
        var badL = r.dLoft!=null && r.dLoft<2.5;
        h+='<tr><td>'+esc(r.c.name)+(r.measured?"":' <span class="tiny">기준</span>')+'</td>'
         +'<td>'+(r.loft!=null?r.loft+"°":"—")+'</td><td>'+r1(r.carry)+'</td>'
         +'<td class="'+(badC?"flagbad":(r.dCarry!=null?"flagok":""))+'">'+(r.dCarry!=null?r.dCarry:"—")+'</td>'
         +'<td class="'+(badL?"flagbad":"")+'">'+(r.dLoft!=null?r.dLoft+"°":"—")+'</td></tr>';
      });
      h+='</tbody></table></div>';
      var tight=g.filter(function(r){return r.dCarry!=null&&r.dCarry<8;});
      if(tight.length) h+='<div class="banner warn" style="margin-top:12px">'+tight.map(function(r){return r.c.name;}).join(", ")+' 구간의 거리 간격이 8m 미만입니다.</div>';
      h+='<button class="btn sm full" style="margin-top:12px" data-act="bagReview">'+(S.busy.bag?'<span class="spin"></span> 분석 중':'가방 전체 진단')+'</button>';
      if(S.msg.bag) h+='<div class="banner bad" style="margin-top:10px">'+esc(S.msg.bag)+'</div>';
      if(S.bagText) h+='<div class="ai" style="margin-top:12px"><div class="hd">가방 진단</div>'+esc(S.bagText)+'</div>';
      h+='</div>';
    }
  }
  h+='</div>';
  return h;
}

/* ---------- 연습 ---------- */
function viewPractice(){
  if(S.draft) return draftView();
  var h='<div class="stack">';
  h+='<div class="spread"><div><h2 class="sec-title">연습 기록</h2><p class="tiny">준비운동과 마무리 운동까지 한 세트입니다</p></div>'
   +'<button class="btn primary sm" data-act="newSession">연습 시작</button></div>';
  if(!S.sessions.length){
    h+= connOK()
      ? '<div class="card empty"><h3>기록이 없습니다</h3><p>연습 시작을 누르면 준비운동 체크부터 안내합니다.</p></div>'
      : '<div class="card empty"><h3>기록을 불러오지 못했습니다</h3><p>위의 다시 연결을 눌러 주세요.</p></div>';
  } else {
    h+='<div class="card">';
    S.sessions.forEach(function(s){
      var bl=(s.blocks||[]).length;
      var wOk=(s.warmup||[]).length>=countReq(WARMUP), cOk=(s.cooldown||[]).length>=countReq(COOLDOWN);
      h+='<div class="listrow" data-act="openSession" data-id="'+esc(s.id)+'">'
       +'<div class="bd"><b>'+esc(fmtDate(s.date))+'</b><span>'+bl+'개 클럽 · '
       +(wOk?'준비운동 ✓':'<span style="color:var(--bad)">준비운동 미완</span>')+' · '
       +(cOk?'마무리 ✓':'<span style="color:var(--bad)">마무리 미완</span>')+'</span></div>'
       +'<div class="rt"><b>'+bl+'</b><span>세트</span></div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function countReq(list){ return list.filter(function(x){return x.req;}).length; }

function newDraft(){
  return {id:uuid(),date:today(),step:0,warmup:[],cooldown:[],blocks:[],feeling:"",coaching:"",
    cur:{clubId:"",m:{}},editing:false};
}
function draftView(){
  var d=S.draft, h='<div class="stack">';
  h+='<div class="spread" style="align-items:center;gap:10px">'
   +'<input type="date" id="dr_date" class="dateTitle" value="'+esc(d.date)+'" max="'+esc(today())+'" aria-label="연습한 날">'

     +'<p class="muted">측정 화면 사진을 올리면 숫자를 읽어 채웁니다.</p>';
    if(d.blocks.length){
      h+='<div style="margin-top:8px">';
      d.blocks.forEach(function(b,i){
        var open=(S.openBlock===i);
        h+='<div class="listrow" data-act="openBlockRow" data-i="'+i+'">'
         +'<span class="grade '+(b.m.grade||"X")+'">'+esc(b.m.grade||"—")+'</span>'
         +'<div class="bd"><b>'+esc(b.clubName)+'</b><span>캐리 '+(b.m.carry!=null?r1(b.m.carry)+"m":"—")
         +' · 방향각 '+numToLR(b.m.dir)+'°'+(b.shots?(' · '+b.shots+'회'):'')+'</span></div>'
         +'<span class="tiny" style="color:var(--fg3);margin-right:6px">'+(open?'접기':'자세히')+'</span>'

     +'<div class="filebtn'+(S.multi.names.length?' on':'')+'" data-pick="multiPhoto" data-title="사진 여러 장 고르기" data-hint="클럽마다 한 장씩">'
     +'<input type="file" multiple accept="'+PICK_ACCEPT+'" id="multiPhoto" aria-label="사진 여러 장 고르기">'
     +'<span class="fb-ic">'+(S.multi.names.length?'✓':'+')+'</span>'
     +'<span class="fb-tx"><b>'+(S.multi.names.length?esc(S.multi.names.length+'장 선택됨'):'사진 여러 장 고르기')+'</b>'
     +'<span>'+esc(S.multi.names.length?S.multi.names.join(", "):'클럽마다 한 장씩')+'</span></span></div>'

        +'</button>';

      h+='<div class="banner'+(S.multi.bad?' warn':' ok')+'" style="margin-top:10px">'+S.multi.log.map(esc).join('<br>')+'</div>';

    h+='<button class="btn full" style="margin-top:12px" data-act="addBlock">사진 없이 한 세트 직접 넣기</button>';

       +'<span class="ct"><b>'+esc(x.t)+(x.req?'':' <span class="chip neutral">선택</span>')+'</b><span>'+esc(x.d)+'</span></span></label>';

    h+='<button class="btn primary full" style="margin-top:14px" data-act="saveSession"'+(doneC<reqC?" disabled":"")+'>'
     +(doneC<reqC?('필수 '+(reqC-doneC)+'개 남음'):'연습 저장')+'</button></div>';
  }
  h+='</div>';
  return h;
}

/* ---------- 라운드 ---------- */
function viewRounds(){
  var h='<div class="stack">';
  h+='<div class="spread"><div><h2 class="sec-title">라운드</h2><p class="tiny">스크린·필드 점수에서 약한 곳을 찾습니다</p></div>'
   +'<button class="btn primary sm" data-act="newRound">점수 입력</button></div>';
  if(!S.rounds.length){
    h+= connOK()
      ? '<div class="card empty"><h3>라운드 기록이 없습니다</h3><p>점수와 퍼팅 수만 넣어도 분석이 나옵니다.</p></div>'
      : '<div class="card empty"><h3>라운드 기록을 불러오지 못했습니다</h3><p>위의 다시 연결을 눌러 주세요.</p></div>';
  } else {
    S.rounds.forEach(function(r){
      h+='<div class="card"><div class="spread"><div><b style="font-family:var(--fDisp);font-size:16px">'+esc(fmtDate(r.date))+'</b>'
       +' <span class="chip neutral">'+(r.type==="field"?"필드":"스크린")+'</span>'
       +(r.course?'<div class="tiny">'+esc(r.course)+'</div>':'')+'</div>'
       +'<button class="btn ghost sm" data-act="delRound" data-id="'+esc(r.id)+'">삭제</button></div>';
      h+='<div class="metrics" style="margin-top:10px">'
       +mTile("스코어",r.score,"")+mTile("퍼팅",r.putts,"")+mTile("페어웨이",r.fw,"/14")
       +mTile("그린적중",r.gir,"/18")+mTile("OB",r.ob,"")+mTile("벌타",r.penalty,"")
       +mTile("파온 미스",r.gir!=null?(18-r.gir):null,"")+mTile("핸디",r.score!=null&&r.par?(r.score-r.par):null,"")+'</div>';
      var tl=holeTally(r);
      if(tl.marks){
        h+='<div class="hRow" style="margin-top:10px">'+tl.marks+'</div>';
        h+='<div class="holeSum"><span>OUT <b>'+tl.out+'</b></span><span>IN <b>'+tl.inn+'</b></span>'
         +'<span>합계 <b>'+tl.sum+'</b></span>'
         +(tl.dbl?('<span>더블 이상 <b>'+tl.dbl+'</b></span>'):'')
         +(tl.good?('<span>파 이상 <b>'+tl.good+'</b></span>'):'')+'</div>';
      }
      if(r.note) h+='<div class="note" style="margin-top:10px">'+esc(r.note)+'</div>';
      h+='<button class="btn sm full" style="margin-top:10px" data-act="analyzeRound" data-id="'+esc(r.id)+'">'
       +(S.busy["rd"+r.id]?'<span class="spin"></span> 분석 중':(r.analysis?'다시 분석':'약점 분석'))+'</button>';
      if(S.msg["rd"+r.id]) h+='<div class="banner bad" style="margin-top:10px">'+esc(S.msg["rd"+r.id])+'</div>';
      if(r.analysis) h+='<div class="ai" style="margin-top:12px"><div class="hd">약점 분석</div>'+esc(r.analysis)+'</div>';
      h+='</div>';
    });
  }
  h+='</div>';
  return h;
}

/* ---------- 성장 ---------- */
function viewGrowth(){
  var h='<div class="stack"><h2 class="sec-title">성장</h2>';
  var tracked=S.clubs.filter(function(c){ return clubSeries(c.id,"carry").length>=1; });
  if(!tracked.length){
    h+='<div class="card empty"><h3>그래프를 그릴 기록이 없습니다</h3><p>클럽별로 두 번 이상 측정하면 추이가 보입니다.</p></div>';
  } else {
    tracked.forEach(function(c){
      var sc=clubSeries(c.id,"carry"), sw=clubSeries(c.id,"width"), sd=clubSeries(c.id,"dir");
      var t=TARGET[tkey(c)];
      h+='<div class="card"><div class="spread"><b style="font-family:var(--fDisp);font-size:16px">'+esc(c.name)+'</b>'
       +'<span class="tiny">'+sc.length+'회 측정</span></div>';
      h+='<canvas class="spark" data-series="'+esc(JSON.stringify(sc.map(function(x){return x.v;})))+'" '
       +'data-lo="'+(t?t.carry[0]:"")+'" data-hi="'+(t?t.carry[1]:"")+'"></canvas>';
      var first=sc[0].v, lastv=sc[sc.length-1].v, dv=Math.round((lastv-first)*10)/10;
      h+='<div class="metrics" style="margin-top:8px">'
       +'<div class="metric"><b>'+r1(lastv)+'</b><span>최근 캐리 m</span></div>'
       +'<div class="metric"><b class="'+(dv>0?"":"")+'">'+(dv>0?"+":"")+dv+'</b><span>처음 대비</span></div>'
       +'<div class="metric"><b>'+(sw.length?r1(sw[sw.length-1].v):"—")+'</b><span>좌우 편차 m</span></div>'
       +'<div class="metric"><b>'+(sd.length?numToLR(sd[sd.length-1].v):"—")+'</b><span>방향각 °</span></div></div>';
      if(t) h+='<p class="tiny" style="margin-top:8px">기준 캐리 '+t.carry[0]+'~'+t.carry[1]+'m · 좌우 편차 '+t.width[1]+'m 이하 · 방향각 ±'+t.dir+'° 이내</p>';
      h+='</div>';
    });
  }
  /* 라운드 추이 */
  if(S.rounds.length>1){
    var rs=S.rounds.slice().reverse().filter(function(r){return r.score!=null;});
    if(rs.length>1){
      h+='<div class="card"><div class="spread"><b style="font-family:var(--fDisp);font-size:16px">스코어</b><span class="tiny">'+rs.length+'라운드</span></div>'
       +'<canvas class="spark" data-series="'+esc(JSON.stringify(rs.map(function(r){return r.score;})))+'" data-invert="1"></canvas>'
       +'<p class="tiny" style="margin-top:6px">아래로 내려갈수록 좋은 기록입니다.</p></div>';
    }
  }
  h+='</div>';
  return h;
}
function drawSparks(){
  var cs=document.querySelectorAll("canvas.spark");
  for(var i=0;i<cs.length;i++){
    (function(cv){
      var data; try{ data=JSON.parse(cv.getAttribute("data-series")||"[]"); }catch(e){ data=[]; }
      if(!data.length) return;
      var dpr=window.devicePixelRatio||1, w=cv.clientWidth||300, hh=76;
      cv.width=w*dpr; cv.height=hh*dpr;
      var x=cv.getContext("2d"); x.scale(dpr,dpr);
      var cs2=getComputedStyle(document.documentElement);
      var acc=cs2.getPropertyValue("--accent").trim()||"#BF4F19";
      var line=cs2.getPropertyValue("--line").trim()||"#ddd";
      var ok=cs2.getPropertyValue("--ok").trim()||"#1C7A58";
      var lo=parseFloat(cv.getAttribute("data-lo")), hi=parseFloat(cv.getAttribute("data-hi"));
      var vals=data.slice(); if(isFinite(lo)) vals.push(lo); if(isFinite(hi)) vals.push(hi);
      var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      if(mx-mn<1){ mx=mn+1; }
      var pad=(mx-mn)*0.18; mn-=pad; mx+=pad;
      var P=10, W=w-P*2, H=hh-P*2;
      function px(i){ return P + (data.length===1? W/2 : W*i/(data.length-1)); }
      function py(v){ return P + H*(1-(v-mn)/(mx-mn)); }
      if(isFinite(lo)&&isFinite(hi)){
        x.fillStyle=ok; x.globalAlpha=.12;
        x.fillRect(P,py(hi),W,Math.max(1,py(lo)-py(hi))); x.globalAlpha=1;
      }
      x.strokeStyle=line; x.lineWidth=1; x.beginPath(); x.moveTo(P,hh-P); x.lineTo(w-P,hh-P); x.stroke();
      x.strokeStyle=acc; x.lineWidth=2.2; x.lineJoin="round"; x.beginPath();
      data.forEach(function(v,i){ i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)); }); x.stroke();
      data.forEach(function(v,i){
        var lastI=i===data.length-1;
        x.beginPath(); x.arc(px(i),py(v),lastI?4.2:2.6,0,6.3);
        x.fillStyle=acc; x.fill();
        if(lastI){ x.fillStyle=cs2.getPropertyValue("--surface").trim()||"#fff";
          x.beginPath(); x.arc(px(i),py(v),1.8,0,6.3); x.fill(); }
      });
    })(cs[i]);
  }
}

/* 홀별 타수를 더하고 파 대비를 센다. */
function holeTally(r){
  var hs=r.holes||[], ps=r.pars||[];
  var o={out:0,inn:0,sum:0,par:0,dbl:0,good:0,marks:"",n:0};
  for(var i=0;i<18;i++){
    var v=hs[i], p=ps[i];
    if(v!=null&&!isNaN(v)){ o.sum+=v; o.n++; if(i<9) o.out+=v; else o.inn+=v; }
    if(p!=null&&!isNaN(p)) o.par+=p;
    if(v!=null&&p!=null&&!isNaN(v)&&!isNaN(p)){
      var d=v-p;
      if(d>=2) o.dbl++;
      if(d<=0) o.good++;
      var cls = d<0?"bird":(d===0?"":(d===1?"bogey":"dbl"));
      o.marks+='<i class="'+cls+'">'+(d>0?("+"+d):(d<0?String(d):"E"))+'</i>';
    }
  }
  return o;
}

function holeCard(r){
  var hs=r.holes||[];
  var open = S.openHoles || hs.some(function(v){ return v!=null; });
  if(!open) return '<button class="btn ghost full" data-act="openHoles">홀별 타수 직접 넣기</button>';
  function nine(from){
    var o='<div class="holes"><span class="rl">홀</span>', i;
    for(i=from;i<from+9;i++) o+='<span>'+(i+1)+'</span>';

    o+='<span class="rl">타수</span>';
    for(i=from;i<from+9;i++) o+='<input type="number" class="num" id="rh_'+i+'" inputmode="numeric" value="'+esc(hs[i]==null?"":hs[i])+'">';
    return o+'</div>';
  }
  var t=holeTally(r);
  var h='<div class="card"><div class="spread"><div class="eyebrow">홀별 타수</div>'
   +'<button class="btn ghost sm" data-act="closeHoles">접기</button></div>';
  h+='<div style="margin-top:10px">'+nine(0)+'</div><div style="margin-top:12px">'+nine(9)+'</div>';
  if(t.n) h+='<div class="holeSum"><span>OUT <b>'+t.out+'</b></span><span>IN <b>'+t.inn+'</b></span>'
   +'<span>합계 <b>'+t.sum+'</b></span>'+(t.par?('<span>코스 파 '+t.par+'</span>'):'')
   +(t.n<18?('<span>'+t.n+'홀만 들어옴</span>'):'')+'</div>';

  return h+'</div>';
}

/* 측정 화면에 찍힌 클럽 표시를 내 가방의 클럽에 맞춘다.
   "7I" "#7" "7번" "DR" "W1" "56" "56°" "SW" "UT" "3H" 같은 표기를 받는다. */
function guessClub(raw){
  var t=String(raw||"").toUpperCase().replace(/\s+/g,"");
  if(!t) return null;
  function find(pred){ for(var i=0;i<S.clubs.length;i++){ if(pred(S.clubs[i])) return S.clubs[i]; } return null; }
  function byId(id){ return find(function(c){ return c.id===id; }); }

  /* 드라이버 */
  if(/^(DR|D|W1|1W|드라이버|DRIVER)$/.test(t)){
    return byId("drv") || find(function(c){ return c.cat==="driver" && !c.spare; }) || find(function(c){ return c.cat==="driver"; });
  }
  /* 퍼터 */
  if(/^(PT|PUTTER|퍼터)$/.test(t)) return find(function(c){ return c.cat==="putter"; });
  /* 웨지 — 로프트 숫자 또는 기호 */
  var lw=/(\d{2})\s*°?/.exec(t);
  if(/^(PW|P|피칭)/.test(t)) return byId("pw") || find(function(c){ return /피칭|PW/i.test(c.name||""); });
  if(/^(AW|GW|A|G|갭)/.test(t)) return byId("w48") || find(function(c){ return c.cat==="wedge" && c.loft===48; });
  if(/^(SW|S|샌드)/.test(t)) return byId("w56") || find(function(c){ return c.cat==="wedge" && c.loft===56; });
  if(/^(LW|L|로브)/.test(t)) return find(function(c){ return c.cat==="wedge" && c.loft>=58; });
  if(lw){
    var L=parseInt(lw[1],10);
    if(L>=44 && L<=64){
      var exact=find(function(c){ return c.cat==="wedge" && num(c.loft)===L; });
      if(exact) return exact;
      var near=null, gap=99;
      S.clubs.forEach(function(c){ if(c.cat!=="wedge"||c.loft==null) return;
        var g=Math.abs(num(c.loft)-L); if(g<gap){ gap=g; near=c; } });
      if(near && gap<=1) return near;
    }
  }
  /* 하이브리드·유틸리티 — "3번 하이브리드"처럼 숫자가 앞에 붙으므로 아이언보다 먼저 본다 */
  if(/하이브리드|HYBRID|유틸|^\d?\s*UT$|^UT\d?$|^\d?H$|^H\d?$/.test(t)){
    return byId("hy3") || find(function(c){ return c.cat==="hybrid"; });
  }
  /* 우드 — "3번 우드" */
  if(/우드|WOOD|^\d\s*W$|^W\s*\d$/.test(t) && !/^W1$|^1W$/.test(t)){
    return find(function(c){ return c.cat==="wood"; });
  }
  if(/퍼터|PUTTER/.test(t)) return find(function(c){ return c.cat==="putter"; });
  if(/드라이버|DRIVER/.test(t)) return byId("drv") || find(function(c){ return c.cat==="driver" && !c.spare; });
  /* 아이언 — 4I, #7, 7번, I7 */
  var ir=/(\d)\s*(I|IRON|번|아이언)|^#?(\d)$|^I\s*(\d)$/.exec(t);
  if(ir){
    var n=parseInt(ir[1]||ir[3]||ir[4],10);
    if(n>=3 && n<=9) return byId("i"+n) || find(function(c){ return c.cat==="iron" && new RegExp("^"+n+"번").test(c.name||""); });
  }
  /* 이름이 그대로 적힌 경우 */
  return find(function(c){ return String(c.name||"").toUpperCase().replace(/\s+/g,"")===t; });
}

/* 사진을 한 장씩 차례로 읽는다. 한꺼번에 보내면 구글 쪽에서 막힌다. */
function runMulti(i){
  var M=S.multi;
  if(i>=M.files.length){
    M.busy=false;
    var made=M.log.filter(function(x){ return x.indexOf("→")>0; }).length;
    M.log.push(made ? ("세트 "+made+"개를 만들었습니다.") : "만들어진 세트가 없습니다.");
    M.files=[];                /* 다시 읽지 않도록 비우되, 사진과 결과는 남겨 둔다 */
    render(); return;
  }
  M.at=i+1; render();
  var f=M.files[i], label=(f.name||("사진"+(i+1)));
  sample.json("측정 화면",{images:[f],modelTier:"default"})
  .then(function(v){
    if(!v){ M.bad=true; M.marks[i]="답이 비었음"; M.log.push(label+" — 답이 비었습니다"); return next(); }
    var m={}, got=0;
    METRICS.forEach(function(x){
      if(v[x.k]==null||v[x.k]==="") return;
      var val=x.lr?lrToNum(v[x.k]):num(v[x.k]);
      if(val==null||isNaN(val)) return;
      m[x.k]=val; got++;
    });
    if(v.grade) m.grade=String(v.grade).toUpperCase().slice(0,1);
    if(!got){ M.bad=true; M.marks[i]="숫자 못 읽음"; M.log.push(label+" — 숫자를 못 읽었습니다"); return next(); }
    var club=v.club?guessClub(v.club):null;
    if(!club){
      M.bad=true;
      M.marks[i]="클럽 못 찾음";
      M.log.push(label+" — 클럽을 못 찾았습니다"+(v.club?(' (화면 표시 "'+v.club+'")'):"")+". 아래에서 직접 넣어 주세요.");
      return next();
    }
    var shots=num(v.shots); if(!(shots>0)) shots=10;
    var prev=lastBlockFor(club.id);
    var ev=evalBlock(club,m,prev?prev.m:null);
    S.draft.blocks.push({clubId:club.id,clubName:club.name,m:m,shots:shots,
      good:ev.good,bad:ev.bad,deltas:ev.deltas,coaching:""});
    M.marks[i]=club.name+(m.carry!=null?(" "+r1(m.carry)+"m"):"");
    M.log.push(label+" → "+club.name+" · 캐리 "+(m.carry!=null?r1(m.carry)+"m":"—")+sizeNote());
    next();
  })
  .catch(function(e){
    M.bad=true; M.marks[i]="실패"; M.log.push(label+" — "+readErr(e));
    next();
  });
  function next(){ render(); setTimeout(function(){ runMulti(i+1); },400); }
}

/* 서버에서 올라온 실패 이유를 그대로 보여준다. 숨기면 고칠 수가 없다. */
function readErr(e){
  var m=(e&&(e.message||e.msg))||"";
  if(e&&e.code==="timeout") return m;
  if(e&&e.code==="invalid_json") return "사진에서 숫자를 찾지 못했습니다. 화면 전체가 또렷하게 나오도록 다시 찍어 주세요.";
  if(/AI 키가 아직 없습니다/.test(m)) return "AI 키가 아직 없습니다. 스크립트 편집기에서 setGeminiKey 로 키를 저장한 뒤 다시 눌러 주세요.";
  if(/혼잡|요청이 몰렸|high demand/i.test(m))
    return "구글 모델이 지금 혼잡합니다. 1~2분 뒤 다시 눌러 주세요. 급하면 아래 칸에 직접 넣으셔도 됩니다.";
  if(m) return m;
  return "읽어내지 못했습니다. 아래 칸에 직접 넣어 주세요.";
}
function takeFile(id,f){
  if(!f) return;
  S.picked=S.picked||{}; S.files=S.files||{};
  S.picked[id]=f.name||"붙여넣은 사진"; S.files[id]=f;
  S.msg[id==="clubPhoto"?"cphoto":"sphoto"]=null;
  prevUrl(id,f);
  render();                 /* 고른 사진을 바로 보여준다 */
}
function paintPick(id){
  var e=document.getElementById(id); if(!e) return;
  var card=e.parentNode, nm=S.picked&&S.picked[id];
  if(!card||!card.classList||!card.classList.contains("filebtn")) return;
  card.classList.toggle("on",!!nm);
  var ic=card.querySelector(".fb-ic"), tx=card.querySelector(".fb-tx");
  if(ic) ic.textContent=nm?"✓":"+";
  if(tx){ var bb=tx.querySelector("b"), ss=tx.querySelector("span");
    if(bb) bb.textContent=nm?"사진 선택됨":(card.getAttribute("data-title")||"사진 고르기");
    if(ss) ss.textContent=nm?nm:(card.getAttribute("data-hint")||""); }
}
/* 선택창이 카메라가 아니라 폴더로 열리게 한다. image/* 는 폰에서 앨범을 먼저 띄운다. */
var PICK_ACCEPT=".jpg,.jpeg,.png,.webp,.heic,.heif,.gif,image/jpeg,image/png,image/webp,image/gif";
function fileField(id,title,hint){
  var f=S.picked&&S.picked[id];
  return '<div class="filebtn'+(f?' on':'')+'" data-pick="'+id+'" data-title="'+esc(title)+'" data-hint="'+esc(hint)+'">'
   +'<input type="file" accept="'+PICK_ACCEPT+'" id="'+id+'" aria-label="'+esc(title)+'">'
   +'<span class="fb-ic">'+(f?'✓':'+')+'</span>'
   +'<span class="fb-tx"><b>'+esc(f?'사진 선택됨':title)+'</b><span>'+esc(f||hint)+'</span></span></div>'
   +'<input type="file" accept="image/*" capture="environment" id="'+id+'_cam" style="display:none" aria-hidden="true">'
   +'<input type="file" id="'+id+'_file" style="display:none" aria-hidden="true">'
   +'<div class="row" style="margin-top:8px;gap:8px">'
   +'<button class="btn ghost sm" data-act="pickFile" data-for="'+id+'">폴더에서 찾기</button>'
   +'<button class="btn ghost sm" data-act="pickCam" data-for="'+id+'">카메라로 찍기</button></div>'
   +'<div class="pastebox" contenteditable="true" data-paste="'+id+'" role="textbox" '
   +'aria-label="사진 붙여넣는 칸" data-ph="여기를 꾹 눌러 → 붙여넣기"></div>'
   +((S.prev&&S.prev[id])
      ? ('<img class="photoPrev" style="margin-top:10px" src="'+S.prev[id]+'" alt="고른 사진">'
         +'<p class="tiny" style="margin-top:4px;color:var(--fg3)">이 사진을 읽습니다. 숫자가 또렷한지 확인하세요.</p>')
      : '');
}
/* 파일 창이 실제로 열렸는지는 화면이 가려지는지로 본다 */
var pickLeft=false;
window.addEventListener("blur",function(){ pickLeft=true; });
document.addEventListener("visibilitychange",function(){ if(document.hidden) pickLeft=true; });
function pickBlockedMsg(){
  return "파일 창이 열리지 않았습니다. 사진을 복사해 아래 칸에 붙여넣거나, 아래 칸에 끌어다 놓아 주세요.";
}
function toDataURL(file,cb){ var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.onerror=function(){ cb(null); }; r.readAsDataURL(file); }

/* 세트 한 줄을 펼쳤을 때 — 숫자 전부와 기준 대비 판정을 보여준다 */
function blockDetail(b){
  var h='<div class="card" style="margin:0 0 10px;background:var(--surface2)">';
  h+='<div class="metrics">';
  METRICS.forEach(function(x){
    var v=b.m[x.k];
    if(v==null) return;
    h+='<div class="metric"><b>'+(x.lr?numToLR(v,x.k==="side"?0:1):r1(v))+'</b>'
     +'<span>'+esc(x.n)+(x.u?(' '+esc(x.u)):'')+'</span></div>';
  });
  h+='</div>';

  if(b.deltas && Object.keys(b.deltas).length){
    var ds=[];
    METRICS.forEach(function(x){
      var dv=b.deltas[x.k];
      if(dv==null||dv===0) return;
      var up=dv>0;
      var good = x.low ? !up : up;              /* 편차는 줄어야 좋다 */
      if(x.lr) good = Math.abs(dv)<0;           /* 방향·사이드스핀은 방향만 보여준다 */
      ds.push('<span class="chip '+(x.lr?'neutral':(good?'ok':'bad'))+'">'
        +esc(x.n)+' '+(up?'+':'')+r1(dv)+'</span>');
    });
    if(ds.length) h+='<div style="margin-top:10px"><div class="eyebrow">지난번 대비</div>'
      +'<div class="row" style="gap:6px;margin-top:6px">'+ds.join('')+'</div></div>';
  }

  if(b.good && b.good.length){
    h+='<div style="margin-top:10px"><div class="eyebrow">기준 안</div><ul class="plain">'
      +b.good.map(function(t){ return '<li class="ok">'+esc(t)+'</li>'; }).join('')+'</ul></div>';
  }
  if(b.bad && b.bad.length){
    h+='<div style="margin-top:10px"><div class="eyebrow">기준 밖</div><ul class="plain">'
      +b.bad.map(function(t){ return '<li class="bad">'+esc(t)+'</li>'; }).join('')+'</ul></div>';
  }
  if((!b.good||!b.good.length)&&(!b.bad||!b.bad.length)){
    h+='<p class="tiny" style="margin-top:10px;color:var(--fg3)">이 클럽의 기준값이 없어 판정을 못 했습니다.</p>';
  }
  h+='</div>';
  return h;
}

function metricSummary(m){
  return METRICS.filter(function(x){return m[x.k]!=null;})
    .map(function(x){ return x.n+" "+(x.lr?numToLR(m[x.k],x.k==="side"?0:1):m[x.k])+x.u; }).join(", ")
    + (m.grade?(", 등급 "+m.grade):"");
}

document.addEventListener("click",function(ev){
  if(!ev.target||!ev.target.closest) return;
  var pk=ev.target.closest("[data-pick]");
  if(pk){
    if(ev.target.tagName==="INPUT") return;
    var pe=document.getElementById(pk.getAttribute("data-pick"));
    if(pe){ try{ pe.click(); }catch(e){} }
    return;
  }
  var el=ev.target.closest("[data-act],[data-tab]");
  if(!el) return;
  var tab=el.getAttribute("data-tab");
  if(tab){ S.tab=tab; S.sheet=null; S.jump=true; render(); window.scrollTo(0,0); return; }
  var a=el.getAttribute("data-act");

  if(a==="reconnect"){ reconnect(); return; }
  if(a==="pickFile"||a==="pickCam"){
    var bid=el.getAttribute("data-for");
    var ie=document.getElementById(a==="pickCam"?(bid+"_cam"):(bid+"_file"));
    if(!ie) ie=document.getElementById(bid);
    var mk=(bid==="clubPhoto"?"cphoto":"sphoto");
    pickLeft=false;
    try{ ie.click(); }
    catch(e){ S.msg[mk]=pickBlockedMsg(); render(); return; }
    setTimeout(function(){
      if(pickLeft) return;
      if(S.files&&S.files[bid]) return;
      S.msg[mk]=pickBlockedMsg(); render();
    },1600);
    return;
  }
  if(a==="closeSheetBg"){ if(ev.target.closest(".inner")) return; S.sheet=null; render(); return; }
  if(a==="closeSheet"){ S.sheet=null; render(); return; }

  /* --- 탐색 --- */
  if(a==="openClub"){ var c=S.clubs.filter(function(x){return x.id===el.getAttribute("data-id");})[0];
    if(c){ S.sheet={kind:"club",data:JSON.parse(JSON.stringify(c))};
      S.msg.diag=null; S.msg.drill=null; S.msg.cq=null; S.qDraft=""; render(); } return; }
  if(a==="addClub"){ clearPick(); S.sheet={kind:"club",data:{cat:"iron"}};
    S.msg.diag=null; S.msg.cq=null; S.qDraft=""; render(); return; }
  if(a==="seedClubs"){
    if(S.busy.seed) return;
    S.busy.seed=true; render();
    var seed=[
      {id:"drv",order:10,name:"드라이버",cat:"driver",loft:10.5},
      {id:"hy3",order:20,name:"3번 하이브리드",cat:"hybrid",loft:19},
      {id:"i4", order:40,name:"4번 아이언",cat:"iron",loft:21},
      {id:"i5", order:50,name:"5번 아이언",cat:"iron",loft:24},
      {id:"i6", order:60,name:"6번 아이언",cat:"iron",loft:27},
      {id:"i7", order:70,name:"7번 아이언",cat:"iron",loft:31},
      {id:"i8", order:80,name:"8번 아이언",cat:"iron",loft:35},
      {id:"i9", order:90,name:"9번 아이언",cat:"iron",loft:39},
      {id:"pw", order:100,name:"피칭 웨지",cat:"wedge",loft:44},
      {id:"w48",order:110,name:"48도 갭웨지",cat:"wedge",loft:48},
      {id:"w52",order:120,name:"52도 웨지",cat:"wedge",loft:52},
      {id:"w56",order:130,name:"56도 웨지",cat:"wedge",loft:56},
      {id:"put",order:140,name:"퍼터",cat:"putter",loft:3}
    ];
    (function one(i){
      if(i>=seed.length){ S.busy.seed=false; loadAll(); return; }
      put("clubs",seed[i],true).then(function(){ one(i+1); })
        .catch(function(){ S.busy.seed=false; flash("클럽을 넣다가 멈췄습니다. 다시 눌러 주세요."); render(); });
    })(0);
    return;
  }
  if(a==="openSession"){ S.sheet={kind:"session",id:el.getAttribute("data-id")}; render(); return; }
  if(a==="newRound"){ S.tab="rounds"; S.openHoles=false;
    S.sheet={kind:"round",data:{date:today(),type:"screen",par:72}}; render(); return; }

  /* --- 클럽 --- */
  if(a==="saveClub"){
    var c2=readClubForm(S.sheet.data);
    if(!c2.order) c2.order=(S.clubs.length+1)*10;
    put("clubs",c2).then(function(){ S.sheet=null; render(); });
    return;
  }
  if(a==="delClub"){ del("clubs",el.getAttribute("data-id")).then(function(){ S.sheet=null; render(); }); return; }

  if(a==="readClubPhoto"){
    var f=fileOf("clubPhoto");
    if(!f){ S.msg.cphoto="사진을 먼저 선택하세요."; render(); return; }
    readClubForm(S.sheet.data);
    S.busy.cphoto=true; S.msg.cphoto=null; render();
    sample.json("골프 클럽 사진입니다. 보이는 각인과 라벨만 근거로 아래 JSON 하나만 답하세요. 읽을 수 없는 항목은 null로 두세요. 추측하지 마세요.\n"
      +'{"name":"가방에서 부를 이름(예: 7번 아이언, 드라이버)","cat":"driver|wood|hybrid|iron|wedge|putter","brand":"브랜드","model":"모델명","loft":숫자 또는 null,"shaft":"샤프트 이름","flex":"R|SR|S|X 등","length":"인치 또는 null","note":"각인·세팅 등 눈에 보이는 특이사항"}',
      {images:[f],modelTier:"default"})
    .then(function(v){
      S.busy.cphoto=false;
      var d=S.sheet&&S.sheet.data; if(!d||!v){ render(); return; }
      ["name","cat","brand","model","shaft","flex","length","note"].forEach(function(k){ if(v[k]) d[k]=String(v[k]); });
      if(v.loft!=null) d.loft=num(v.loft);
      toDataURL(f,function(u){ if(u&&u.length<700000&&S.sheet) S.sheet.data.photo=u; render(); });
      render();
    }).catch(function(e){ S.busy.cphoto=false;
      S.msg.cphoto = readErr(e); render(); });
    return;
  }

  if(a==="diagClub"){
    var c3=readClubForm(S.sheet.data);
    var gaps=bagGaps().map(function(r){ return r.c.name+" "+(r.loft!=null?r.loft+"도 ":"")+r1(r.carry)+"m"; }).join(" / ");
    var bb=clubBest(c3.id);
    var p=profileText()+"\n\n아래 클럽 하나를 점검합니다.\n"
      +"클럽: "+[c3.name,c3.brand,c3.model,(c3.loft?c3.loft+"도":""),c3.shaft,c3.flex,c3.length?c3.length+"인치":"",c3.note].filter(Boolean).join(" / ")
      +"\n실측 캐리: "+(bb?bb.carry+"m":"아직 없음")
      +"\n가방 전체(긴 것부터): "+gaps
      +"\n\n두 부분으로 답하세요. 머리말 없이 바로 시작합니다.\n"
      +"[특성] 이 클럽이 어떤 성격인지 3~4문장.\n"
      +"[점검] 부족하거나 확인이 필요한 점을 '- '로 시작하는 짧은 항목 2~4개. 각 항목은 한 문장. 문제가 없으면 '- 현재 구성에서 문제 없음' 한 줄만.";
    ask("diag",p,{modelTier:"default"}).then(function(t){
      var d=S.sheet&&S.sheet.data; if(!d) return;
      var mSpec=t.split(/\[점검\]/)[0].replace(/\[특성\]/,"").trim();
      var rest=t.split(/\[점검\]/)[1]||"";
      d.spec=mSpec;
      d.issues=rest.split("\n").map(function(x){return x.replace(/^[-•\s]+/,"").trim();}).filter(function(x){return x.length>3;});
      render();
    }).catch(function(){});
    return;
  }

  if(a==="askPreset"){
    readClubForm(S.sheet.data);
    S.qDraft=el.getAttribute("data-q")||"";
    askClubNow();
    return;
  }
  if(a==="askClub"){
    readClubForm(S.sheet.data);
    askClubNow();
    return;
  }
  if(a==="clearQA"){
    var cz=readClubForm(S.sheet.data);
    cz.qa=[];
    if(cz.id) put("clubs",cz,true);
    render();
    return;
  }

  if(a==="customDrill"){
    var c4=readClubForm(S.sheet.data);
    var hist=clubSeries(c4.id,"carry");
    var lb=lastBlockFor(c4.id);
    var T=TARGET[tkey(c4)];
    var p2=profileText()+"\n\n클럽: "+[c4.name,c4.brand,c4.model,(c4.loft?c4.loft+"도":""),c4.shaft,c4.flex].filter(Boolean).join(" / ")
      +"\n최근 10회 평균: "+(lb?metricSummary(lb.m):"측정 기록 없음")
      +(T?("\n이 클럽의 목표: 캐리 "+T.carry[0]+"~"+T.carry[1]+"m, 발사각 "+T.launch[0]+"~"+T.launch[1]+"도, 백스핀 "+T.back[0]+"~"+T.back[1]+", 좌우 편차 "+T.width[1]+"m 이하, 방향각 ±"+T.dir+"도 이내"):"")
      +"\n측정 횟수: "+hist.length+"회"
      +"\n\n이 클럽만을 위한 50발 연습 계획을 주세요. 10발 단위 4~5단계로 나누고, 각 단계마다 '무엇을 바꾸는지' 한 가지만 지정하세요. "
      +"마지막에 성공 판정 기준을 숫자로 제시하세요. 전체 350자 이내, 머리말 없이 바로 시작.";
    ask("drill",p2,{modelTier:"default"}).then(function(t){
      if(S.sheet&&S.sheet.data){ S.sheet.data.drill=t; render(); }
    }).catch(function(){});
    return;
  }

  if(a==="openBought"){ S.openBought=true; S.msg.bought=null; render(); return; }
  if(a==="closeBought"){ S.openBought=false; render(); return; }
  if(a==="applyBought"){
    var bcE=document.getElementById("bt_cat"), bwE=document.getElementById("bt_when");
    var bcat=bcE?bcE.value:"iron", bwhen=bwE?String(bwE.value).trim():"";
    S.boughtWhen=bwhen;
    if(!bwhen){ S.msg.bought="구입 시기를 먼저 적어 주세요."; S.msg.boughtBad=true; render(); return; }
    var targets=S.clubs.filter(function(c){ return bcat==="all" || c.cat===bcat; });
    if(!targets.length){ S.msg.bought="해당 분류의 클럽이 없습니다."; S.msg.boughtBad=true; render(); return; }
    S.busy.bought=true; S.msg.bought=null; S.msg.boughtBad=false;
    S.boughtDone=0; S.boughtAll=targets.length; render();
    (function step(i){
      if(i>=targets.length){
        S.busy.bought=false;
        S.msg.bought=targets.length+"개에 "+bwhen+" 을 넣었습니다 — "+targets.map(function(c){return c.name;}).join(", ");
        S.msg.boughtBad=false;
        syncCache(); render();
        return;
      }
      var c0=targets[i];
      c0.bought=bwhen;
      put("clubs",c0,true).then(function(){
        S.boughtDone=i+1; render(); step(i+1);
      }).catch(function(e){
        S.busy.bought=false;
        S.msg.bought=(c0.name||"클럽")+" 에서 멈췄습니다: "+((e&&e.message)||"저장 실패")+". 다시 눌러 주세요.";
        S.msg.boughtBad=true; render();
      });
    })(0);
    return;
  }

  if(a==="bagReview"){
    var rows=bagGaps().map(function(r){ return r.c.name+" "+(r.loft!=null?r.loft+"도 ":"")+r1(r.carry)+"m"+(r.measured?"(실측)":"(기준값)")+(r.dCarry!=null?" 간격 "+r.dCarry+"m":""); }).join("\n");
    var p3=profileText()+"\n\n가방 구성(긴 것부터):\n"+rows
      +"\n\n이 구성에서 (1) 역할이 겹쳐 뺄 수 있는 클럽, (2) 비어 있는 거리 구간, (3) 지금 당장 바꿀 필요가 없는 이유를 각각 짚어 주세요. "
      +"장비 구입 권유보다 지금 가진 것으로 해결하는 쪽을 우선하세요. 400자 이내, 머리말 없이.";
    ask("bag",p3,{modelTier:"default"}).then(function(t){ S.bagText=t; render(); }).catch(function(){});
    return;
  }

  /* --- 연습 세션 --- */
  if(a==="newSession"){ S.tab="practice"; S.draft=newDraft(); S.jump=true; render(); window.scrollTo(0,0); return; }
  if(a==="cancelDraft"){ S.draft=null; render(); return; }
  if(a==="step"){
    var s=+el.getAttribute("data-s");
    if(s===3){ var fb=document.getElementById("feelBox"); if(fb) S.draft.feeling=fb.value; }
    S.draft.step=s; S.jump=true; render(); window.scrollTo(0,0); return;

      S.multi.files.push(fl[mi]);
      S.multi.names.push(fl[mi].name||("사진"+(mi+1)));
      S.multi.urls.push(makeUrl(fl[mi]));
      S.multi.marks.push("");
    }
    render(); return;
  }
  if(t && t.type==="file"){
    var bid=String(t.id||"").replace(/_(cam|file)$/,"");
    var f=t.files&&t.files[0];
    if(f && f.type && !/^image\//.test(f.type)){
      S.msg[bid==="clubPhoto"?"cphoto":"sphoto"]="사진 파일(JPG·PNG)만 됩니다.";
      render(); return;
    }
    if(f) takeFile(bid,f);
    else { S.picked=S.picked||{}; S.files=S.files||{};
           S.picked[bid]=null; S.files[bid]=null; paintPick(bid); }
    return;
  }
  if(t.id==="lk_remember"||t.id==="lk_auto"){
    setPref(t.id==="lk_remember"?"remember":"auto", !!t.checked);
    if(t.id==="lk_remember" && !t.checked) rememberName("");
    S.lock.focused=true; render(); return;
  }
  if(t.id==="dr_date" && S.draft){
    var dv=t.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)){ S.msg.date="날짜를 골라 주세요."; render(); return; }
    if(dv>today()){ S.msg.date="앞으로 올 날짜는 넣을 수 없습니다."; t.value=S.draft.date; render(); return; }
    S.draft.date=dv; S.msg.date=null; render(); return;
  }
  if(t.id==="bk_club" && S.sheet && S.sheet.kind==="block"){ readBlockForm(S.sheet.data); render(); }
},false);

/* 사진 칸에 끌어다 놓기 */
["dragenter","dragover"].forEach(function(n){
  document.addEventListener(n,function(ev){
    var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
    if(!z) return;
    ev.preventDefault(); ev.stopPropagation(); z.classList.add("drag");
  },false);
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
  if(z) z.classList.remove("drag");
},false);
document.addEventListener("drop",function(ev){
  var z=ev.target&&ev.target.closest&&ev.target.closest("[data-pick]");
  if(!z) return;
  ev.preventDefault(); ev.stopPropagation(); z.classList.remove("drag");
  var id=z.getAttribute("data-pick");
  var dt=ev.dataTransfer, fs=(dt&&dt.files)||[];
  if(id.indexOf("multiPhoto")===0){
    multiReset();
    for(var di=0;di<fs.length;di++){
      if(fs[di].type && !/^image\//.test(fs[di].type)) continue;
      S.multi.files.push(fs[di]);
      S.multi.names.push(fs[di].name||("사진"+(di+1)));
      S.multi.urls.push(makeUrl(fs[di]));
      S.multi.marks.push("");
    }
    render(); return;
  }
  var f=fs[0];
  if(f && /^image\//.test(f.type)) takeFile(id,f);
  else { S.msg[id==="clubPhoto"?"cphoto":"sphoto"]="사진 파일만 됩니다."; render(); }
},false);

/* 붙여넣기 */
document.addEventListener("paste",function(ev){
  if(!S.sheet) return;
  var box=ev.target&&ev.target.closest&&ev.target.closest("[data-paste]");
  var id = box ? box.getAttribute("data-paste")
         : (S.sheet.kind==="club" ? "clubPhoto" : (S.sheet.kind==="block" ? "shotPhoto" : null));
  if(!id || !document.getElementById(id)) return;
  var items=(ev.clipboardData&&ev.clipboardData.items)||null;
  var files=(ev.clipboardData&&ev.clipboardData.files)||null;
  var got=null;
  if(files&&files.length&&/^image\//.test(files[0].type)) got=files[0];
  if(!got&&items) for(var i=0;i<items.length;i++){
    if(items[i].kind==="file"){
      var f2=items[i].getAsFile();
      if(f2 && /^image\//.test(f2.type)){ got=f2; break; }
    }
  }
  ev.preventDefault();
  if(box) box.textContent="";
  if(got) takeFile(id,got);
  else { S.msg[id==="clubPhoto"?"cphoto":"sphoto"]="붙여넣은 것에 사진이 없습니다. 사진을 먼저 복사해 주세요."; render(); }
},false);

/* 테마 토글 */
document.getElementById("themeBtn").addEventListener("click",function(){
  var root=document.documentElement, cur=root.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark?"light":"dark");
  try{ localStorage.setItem("swinglog.theme", dark?"light":"dark"); }catch(e){}
  drawSparks();
});
try{ var th=localStorage.getItem("swinglog.theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
window.addEventListener("resize",function(){ drawSparks(); });

/* ====================== 기동 ====================== */
/* 카메라로 바로 찍은 사진은 4~6MB에 4000px이 넘는다.
   그대로 보내면 올리는 데만 한참 걸려 시간이 다 간다.
   숫자를 읽는 데는 긴 변 1280px이면 충분하므로 보내기 전에 줄인다.
   큰 사진에서 한 가지 방법이 실패하는 일이 잦아 세 가지를 차례로 시도한다. */
var MAX_PX=1000, JPEG_Q=0.70, MAX_BYTES=450000;

function canvasToUrl(src,w,h,maxPx,q){
  var k=Math.min(1, maxPx/Math.max(w,h));
  var cw=Math.max(1,Math.round(w*k)), ch=Math.max(1,Math.round(h*k));
  var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  var cx=cv.getContext("2d");
  cx.fillStyle="#fff"; cx.fillRect(0,0,cw,ch);
  cx.drawImage(src,0,0,cw,ch);
  return {url:cv.toDataURL("image/jpeg",q), w:cw, h:ch};
}

/* 결과가 아직 크면 더 줄인다. 글자만 읽으면 되므로 과감해도 된다. */
function squeeze(src,w,h){
  var px=MAX_PX, q=JPEG_Q, out=null;
  for(var i=0;i<4;i++){
    try{ out=canvasToUrl(src,w,h,px,q); }catch(e){ return null; }
    if(out.url.length*0.75 <= MAX_BYTES) return out;
    px=Math.round(px*0.8); q=Math.max(0.5,q-0.08);
  }
  return out;
}

function toDataURLp(file){
  return new Promise(function(res,rej){
    var done=false;
    function ok(out,how){
      if(done) return; done=true;
      S.shrunk={from:file.size||0,to:Math.round(out.url.length*0.75),w:out.w,h:out.h,how:how};
      res(out.url);
    }
    function raw(){
      if(done) return; done=true;
      S.shrunk={from:file.size||0,to:file.size||0,w:0,h:0,how:"원본"};
      var r=new FileReader();
      r.onload=function(){ res(r.result); };
      r.onerror=function(){ rej({message:"사진을 읽지 못했습니다."}); };
      r.readAsDataURL(file);
    }

    /* 1) createImageBitmap — 큰 사진에 가장 강하고 회전도 바로잡는다 */
    if(window.createImageBitmap){
      var opt={};
      try{ opt={imageOrientation:"from-image"}; }catch(e){}
      var pr;
      try{ pr=createImageBitmap(file,opt); }catch(e){ pr=null; }
      if(pr && pr.then){
        pr.then(function(bm){
          var out=squeeze(bm,bm.width,bm.height);
          try{ bm.close&&bm.close(); }catch(e){}
          if(out) ok(out,"줄임"); else viaImage();
        }).catch(function(){ viaImage(); });
        return;
      }
    }
    viaImage();

    /* 2) Image + objectURL */
    function viaImage(){
      if(done) return;
      var url;
      try{ url=URL.createObjectURL(file); }catch(e){ raw(); return; }
      var img=new Image();
      var t=setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} raw(); },8000);
      img.onload=function(){
        clearTimeout(t);
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        try{URL.revokeObjectURL(url);}catch(e){}
        if(!w||!h){ raw(); return; }
        var out=squeeze(img,w,h);
        if(out) ok(out,"줄임"); else raw();
      };
      img.onerror=function(){ clearTimeout(t); try{URL.revokeObjectURL(url);}catch(e){} raw(); };
      img.src=url;
    }
  });
}

function sizeNote(){
  var k=S.shrunk;
  if(!k) return "";
  function mb(n){ return n>=1048576 ? (Math.round(n/104857.6)/10+"MB") : (Math.round(n/1024)+"KB"); }
  if(k.how==="원본") return " (줄이지 못해 원본 "+mb(k.from)+"을 보냈습니다)";
  return " ("+mb(k.from)+" → "+mb(k.to)+", "+k.w+"×"+k.h+")";
}

/* 서버가 끝내 답하지 않으면 영원히 돌지 않도록 끊는다. */
function withTimeout(pr,ms,msg){
  return new Promise(function(res,rej){
    var done=false;
    var t=setTimeout(function(){ if(!done){ done=true; rej({code:"timeout",message:msg}); } },ms);
    pr.then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } },
            function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
  });
}
/* 아래 sample 은 아티팩트판과 같은 모양을 유지하기 위한 껍데기다.
   실제 호출은 전부 앱스 스크립트 서버를 거쳐 제미나이로 간다. */
var sample = function(prompt,opts){
  return call("apiAsk",prompt).then(function(t){ return {text:t,truncated:false}; });
};
sample.json = function(prompt,opts){
  var f = opts && opts.images && opts.images[0];
  if(!f) return call("apiAsk",prompt).then(function(t){
    try{ return JSON.parse(t); }catch(e){ throw {code:"invalid_json",message:t}; }
  });
  return toDataURLp(f).then(function(u){
    var fn = /라운드/.test(prompt) ? "apiReadRound"
           : /클럽/.test(prompt) ? "apiReadClub" : "apiReadShot";
    return withTimeout(call(fn,u), 170000,
      "답이 오지 않았습니다"+sizeNote()+". 편집기에서 testPhotoSpeed 를 실행하면 "
      +"구글 쪽이 느린 것인지 알 수 있습니다. 급하면 아래 칸에 직접 넣어 주세요.");
  });
};
sample.limits = function(){ return Promise.resolve({images: ready.img?{maxCount:1}:undefined}); };

/* 자동 로그인이 켜져 있으면 브라우저를 닫아도 남는 곳에, 꺼져 있으면
   탭을 닫으면 사라지는 곳에 둔다. 비밀번호는 어느 쪽에도 저장하지 않는다. */
function pref(k,dflt){ try{ var v=localStorage.getItem("swinglog."+k); return v===null?dflt:v==="1"; }catch(e){ return dflt; } }
function setPref(k,on){ try{ localStorage.setItem("swinglog."+k, on?"1":"0"); }catch(e){} }

function getToken(){
  try{ var a=localStorage.getItem("swinglog.tk"); if(a) return a; }catch(e){}
  try{ var b=sessionStorage.getItem("swinglog.tk"); if(b) return b; }catch(e){}
  return "";
}
function saveToken(t){
  try{ localStorage.removeItem("swinglog.tk"); }catch(e){}
  try{ sessionStorage.removeItem("swinglog.tk"); }catch(e){}
  if(!t) return;
  if(pref("auto",true)){ try{ localStorage.setItem("swinglog.tk",t); }catch(e){} }
  else { try{ sessionStorage.setItem("swinglog.tk",t); }catch(e){} }
}
function savedName(){ try{ return localStorage.getItem("swinglog.name")||""; }catch(e){ return ""; } }
function rememberName(n){
  try{
    if(pref("remember",true) && n) localStorage.setItem("swinglog.name",n);
    else localStorage.removeItem("swinglog.name");
  }catch(e){}
}

function tickWait(){
  if(S.lock.wait<=0) return;
  setTimeout(function(){
    S.lock.wait--; if(S.lock.wait<=0){ S.lock.err=null; }
    if(S.lock.need) render();
    tickWait();
  },1000);
}

/* 화면을 그리기 전에 잠금 상태부터 묻는다. */
function gate(){
  if(!S.lock.id && pref("remember",true)) S.lock.id=savedName();
  if(!apiUrl()){ S.lock.need=true; S.lock.needUrl=true; render(); return Promise.resolve(); }
  return call("apiAuthState",getToken()).then(function(st){
    S.openMode=!!st.open;
    S.lock.name=st.name||"";
    S.lock.id=st.loginId||S.lock.id||"";
    S.lock.need=!st.unlocked;
    render();
    if(!S.lock.need) boot();
  }).catch(function(e){
    /* 잠금 상태를 못 물었으면 열어주지 않는다 */
    S.lock.need=true; S.lock.err=(e&&e.message)||"서버에 연결하지 못했습니다.";
    render();
  });
}

function boot(){
  S.conn.tried=true;
  var had=showCached();
  if(had) render();              /* 기다리지 않고 바로 보여준다 */
  /* 잠금을 푼 뒤부터 센다. 페이지가 열린 시각부터 재면 잠금 화면에 머문 시간까지 포함돼
     한 번 지나가 버리고, 그 뒤로는 영영 아무 말도 하지 않게 된다. */
  if(S.loadTimer) clearTimeout(S.loadTimer);
  S.loadTimer=setTimeout(function(){
    if(S.loaded) return;
    S.conn.tried=true;
    if(!S.conn.err) S.conn.err="시트가 20초 동안 답하지 않았습니다. 다시 연결을 눌러 주세요.";
    S.loaded=true; render();
  },20000);
  return loadAll(had);
}
function reconnect(){
  S.conn.retrying=true; S.conn.err=null; render();
  boot().then(function(){ S.conn.retrying=false; render(); })
        .catch(function(){ S.conn.retrying=false; render(); });
}
render();
gate();
})();
</script>
