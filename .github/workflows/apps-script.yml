# 서버 코드를 구글 앱스 스크립트로 자동 반영한다.
#
# 쓰려면 저장소 Settings → Secrets and variables → Actions 에 두 개를 넣는다.
#   CLASPRC_JSON  : PC에서 clasp login 한 뒤 생긴 ~/.clasprc.json 내용 전부
#   DEPLOYMENT_ID : clasp deployments 로 확인한, 지금 쓰고 있는 배포의 ID
#
# DEPLOYMENT_ID 를 꼭 넣어야 한다. 없으면 새 배포가 만들어져 /exec 주소가 바뀐다.
# 둘 중 하나라도 없으면 이 작업은 조용히 건너뛴다.
name: 앱스 스크립트 배포

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 비밀값이 있는지 본다
        id: gate
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "CLASPRC_JSON 또는 DEPLOYMENT_ID 가 없어 건너뜁니다."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'yes'
        with: { node-version: '20' }

      - name: clasp 설치
        if: steps.gate.outputs.ready == 'yes'
        run: npm i -g @google/clasp@2.4.2

      - name: 자격 증명 쓰기
        if: steps.gate.outputs.ready == 'yes'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: 문법 확인
        if: steps.gate.outputs.ready == 'yes'
        run: node -e "new Function(require('fs').readFileSync('server/Code.gs','utf8'))"

      - name: 올리고 같은 주소로 다시 배포
        if: steps.gate.outputs.ready == 'yes'
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          cd server
          clasp push --force
          clasp deploy -i "$DEPLOYMENT_ID" -d "github ${GITHUB_SHA::7}"
